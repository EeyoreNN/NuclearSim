<script>
(function () {
  var STORE_KEY = "mx-words-41-44-quiz-v1";
  var RAW = [
    [41, "supplicate", "ask humbly and earnestly", "The villagers supplicated the governor for food."],
    [41, "diatribe", "a bitter, abusive speech", "His diatribe against the call lasted the whole ride home."],
    [41, "exacerbate", "make worse", "Scratching the rash will only exacerbate it."],
    [41, "deplorable", "lamentable, miserable", "The storm left the harbor in a deplorable state."],
    [41, "desist", "stop", "The librarian told them to desist from shouting."],
    [41, "paradox", "seems contradictory but is in some way true", "\"Less is more\" is a familiar paradox."],
    [41, "epithet", "an adjective that characterizes, not just describes", "\"Swift-footed\" is an epithet for Achilles."],
    [41, "arbitrary", "random, without reason", "The new seating chart felt arbitrary."],
    [41, "complacent", "smug", "After one easy win, the team grew complacent."],
    [41, "assiduous", "careful, diligent", "Assiduous practice improved her serve."],
    [41, "repudiate", "disown", "She repudiated the rumor in a short statement."],
    [41, "attest", "be proof of", "The worn boots attest to years of trail work."],
    [41, "averse", "having a distaste for", "He is averse to speaking in front of a crowd."],
    [41, "castigate", "scold severely", "The coach castigated the players for missing practice."],
    [41, "cursory", "hasty, superficial", "A cursory glance missed the second mistake."],
    [42, "sinuous", "winding", "A sinuous path led down to the river."],
    [42, "curtail", "shorten", "Rain curtailed the outdoor rehearsal."],
    [42, "avarice", "greed", "Avarice made him keep every coin he found."],
    [42, "furtive", "sneaky", "She took a furtive look at the clock during the talk."],
    [42, "gesticulate", "make gestures", "He gesticulated so much he nearly knocked over a glass."],
    [42, "profligate", "recklessly wasteful", "Profligate spending emptied the club account."],
    [42, "fruition", "achievement of what was worked for", "Years of practice came to fruition at the recital."],
    [42, "abet", "encourage, incite", "Laughing at the prank only abets the next one."],
    [42, "banal", "trite, unoriginal", "The movie ending was banal."],
    [42, "brazen", "shameless", "The brazen lie surprised even his friends."],
    [42, "clemency", "mercy", "The principal showed clemency and shortened the detention."],
    [42, "coerce", "force", "Nobody should coerce you into signing that form."],
    [42, "convivial", "sociable", "The convivial host pulled every guest into the conversation."],
    [42, "daunt", "intimidate", "The steep first hill did not daunt her."],
    [42, "defamation", "slander", "Printing that false story was defamation."],
    [43, "guise", "outward appearance", "He came back in the guise of a delivery driver."],
    [43, "conversant", "familiar", "She is conversant with the lab safety rules."],
    [43, "deign", "condescend to grant", "The busy editor did not deign to answer the email."],
    [43, "efface", "wipe out", "Rain could not efface the chalk drawing completely."],
    [43, "concurrent", "happening at the same time", "Two concurrent clubs forced her to choose one."],
    [43, "effervescent", "bubbly, lively", "Her effervescent laugh filled the room."],
    [43, "encroach", "intrude gradually", "Weeds began to encroach on the garden path."],
    [43, "apex", "highest point", "They reached the apex of the climb at noon."],
    [43, "encumber", "burden", "A heavy pack encumbered the hikers."],
    [43, "ensconce", "settle comfortably", "The cat ensconced itself on the warm chair."],
    [43, "exhort", "urge on", "The captain exhorted the team to finish the drill."],
    [43, "foist", "impose by trickery", "He tried to foist the leftover chores on his brother."],
    [43, "gibe", "mocking remark", "The gibe about his shoes stung more than he admitted."],
    [43, "gloat", "take malicious pleasure", "Do not gloat just because the other team lost."],
    [43, "languid", "listless", "The languid heat made everyone move slowly."],
    [44, "impair", "weaken", "Too little sleep can impair your memory."],
    [44, "esoteric", "understood by few", "The manual was too esoteric for a new player."],
    [44, "incipient", "just beginning", "She rested so the incipient cold would not grow."],
    [44, "equivocal", "ambiguous", "His equivocal reply left the group unsure."],
    [44, "ineffectual", "powerless", "The ineffectual protest changed nothing."],
    [44, "mortify", "humiliate", "Tripping on the way to the microphone would mortify him."],
    [44, "ramification", "consequence", "One missed deadline had ramifications for the whole project."],
    [44, "inscrutable", "impossible to understand", "The cat's inscrutable stare gave nothing away."],
    [44, "lackluster", "dull", "The lackluster speech lost the audience."],
    [44, "latitude", "freedom from restraints", "The teacher gave them latitude in choosing a topic."],
    [44, "mitigate", "make less severe", "A quick apology can mitigate the hurt."],
    [44, "muse", "ponder", "She sat by the window to muse over the last paragraph."],
    [44, "ornate", "elaborately decorated", "The ornate frame drew more looks than the photo."],
    [44, "parlance", "manner of speaking", "In soccer parlance, that play is called a give-and-go."],
    [44, "prim", "stiffly proper", "His prim posture made the joke seem even funnier."]
  ];

  var WORDS = RAW.map(function (row) {
    return { id: row[1], list: row[0], word: row[1], def: row[2], example: row[3] };
  });
  var WORD_BY_ID = {};
  WORDS.forEach(function (word) { WORD_BY_ID[word.id] = word; });

  var BLOCK_PAIRS = [
    ["castigate", "diatribe"], ["castigate", "mortify"], ["castigate", "gibe"],
    ["exacerbate", "encumber"], ["exacerbate", "impair"],
    ["efface", "curtail"], ["efface", "desist"], ["efface", "impair"],
    ["exhort", "abet"], ["diatribe", "gibe"], ["diatribe", "defamation"], ["gibe", "defamation"],
    ["esoteric", "inscrutable"], ["esoteric", "equivocal"], ["inscrutable", "equivocal"],
    ["paradox", "equivocal"], ["languid", "lackluster"], ["languid", "ineffectual"],
    ["lackluster", "ineffectual"], ["lackluster", "banal"], ["complacent", "brazen"],
    ["avarice", "profligate"], ["effervescent", "convivial"], ["coerce", "foist"],
    ["parlance", "epithet"]
  ];
  var BLOCK = {};
  BLOCK_PAIRS.forEach(function (pair) {
    BLOCK[pair.slice().sort().join("|")] = true;
  });

  var BADGE_DEFS = [
    { id: "first", name: "First word", detail: "Answer one question." },
    { id: "combo5", name: "Combo 5", detail: "Five correct in a row." },
    { id: "combo10", name: "Combo 10", detail: "Ten correct in a row." },
    { id: "list41", name: "List 41", detail: "Get every List 41 word right at least once." },
    { id: "list42", name: "List 42", detail: "Get every List 42 word right at least once." },
    { id: "list43", name: "List 43", detail: "Get every List 43 word right at least once." },
    { id: "list44", name: "List 44", detail: "Get every List 44 word right at least once." },
    { id: "all60", name: "All 60", detail: "Get every word right at least once." },
    { id: "typed10", name: "Exact typist", detail: "Type 10 words with exact spelling." },
    { id: "mock80", name: "Mock 80%", detail: "Score at least 80% on a mock test." },
    { id: "mock100", name: "Perfect mock", detail: "Score 100% on a mock test." },
    { id: "leitner", name: "Box 3 x10", detail: "Move 10 words into Leitner box 3." },
    { id: "match", name: "Clean match", detail: "Finish a matching round with no mistakes." }
  ];

  function shuffle(list) {
    var copy = list.slice();
    for (var i = copy.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var swap = copy[i];
      copy[i] = copy[j];
      copy[j] = swap;
    }
    return copy;
  }

  function isBlocked(a, b) {
    return !!BLOCK[[a, b].sort().join("|")];
  }

  function normalizeWord(value) {
    return String(value || "").toLowerCase().replace(/[^a-z]/g, "");
  }

  function damerau(a, b) {
    var n = a.length;
    var m = b.length;
    var dp = [];
    for (var i = 0; i <= n; i++) {
      dp[i] = [];
      for (var j = 0; j <= m; j++) dp[i][j] = 0;
      dp[i][0] = i;
    }
    for (var k = 0; k <= m; k++) dp[0][k] = k;
    for (var x = 1; x <= n; x++) {
      for (var y = 1; y <= m; y++) {
        var cost = a.charAt(x - 1) === b.charAt(y - 1) ? 0 : 1;
        dp[x][y] = Math.min(dp[x - 1][y] + 1, dp[x][y - 1] + 1, dp[x - 1][y - 1] + cost);
        if (x > 1 && y > 1 && a.charAt(x - 1) === b.charAt(y - 2) && a.charAt(x - 2) === b.charAt(y - 1)) {
          dp[x][y] = Math.min(dp[x][y], dp[x - 2][y - 2] + 1);
        }
      }
    }
    return dp[n][m];
  }

  function gradeTyped(input, answer) {
    var typed = normalizeWord(input);
    var target = normalizeWord(answer);
    if (!typed) return "empty";
    if (typed === target) return "exact";
    var stolen = WORDS.some(function (word) { return word.word !== answer && normalizeWord(word.word) === typed; });
    if (stolen) return "wrong";
    if (target.length >= 4 && damerau(typed, target) === 1) return "close";
    return "wrong";
  }

  function otherWords(word) {
    return WORDS.filter(function (item) { return item.id !== word.id && !isBlocked(item.id, word.id); });
  }

  function pickDistractors(word, field) {
    var pool = otherWords(word);
    var same = shuffle(pool.filter(function (item) { return item.list === word.list; }));
    var rest = shuffle(pool.filter(function (item) { return item.list !== word.list; }));
    var ordered = same.concat(rest);
    var chosen = [];
    var seen = {};
    ordered.forEach(function (item) {
      if (chosen.length >= 3) return;
      var value = item[field];
      if (seen[value] || value === word[field]) return;
      seen[value] = true;
      chosen.push(item);
    });
    return chosen;
  }

  function choiceSet(word, field) {
    var correct = { id: word.id, text: word[field], correct: true };
    var options = [correct].concat(pickDistractors(word, field).map(function (item) {
      return { id: item.id, text: item[field], correct: false };
    }));
    return shuffle(options);
  }

  function wordsIn(scope) {
    if (scope === "all") return WORDS.slice();
    return WORDS.filter(function (word) { return word.list === scope; });
  }

  function chunkMatching(list) {
    var items = list.slice();
    items.sort(function (a, b) {
      function degree(word) {
        return list.filter(function (other) { return other.id !== word.id && isBlocked(word.id, other.id); }).length;
      }
      return degree(b) - degree(a) || (Math.random() - 0.5);
    });
    var rounds = [];
    function canAdd(round, word) {
      return round.length < 5 && round.every(function (other) { return !isBlocked(other.id, word.id); });
    }
    function solve(index) {
      if (index === items.length) return true;
      var word = items[index];
      var order = shuffle(rounds.map(function (_, i) { return i; }));
      for (var n = 0; n < order.length; n++) {
        var round = rounds[order[n]];
        if (!canAdd(round, word)) continue;
        round.push(word);
        if (solve(index + 1)) return true;
        round.pop();
      }
      if (rounds.length * 5 < items.length) {
        rounds.push([word]);
        if (solve(index + 1)) return true;
        rounds.pop();
      }
      return false;
    }
    if (!solve(0)) return items.map(function (word) { return [word]; });
    return rounds;
  }

  function emptyProgress() {
    return {
      xp: 0, combo: 0, bestCombo: 0, correct: 0, attempted: 0,
      exactTyped: 0, cleanMatches: 0, theme: "dark",
      words: {}, badges: {}, mocks: []
    };
  }

  function loadProgress() {
    var base = emptyProgress();
    try {
      if (typeof localStorage === "undefined") return base;
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return base;
      var data = JSON.parse(raw);
      base.xp = data.xp | 0;
      base.combo = data.combo | 0;
      base.bestCombo = data.bestCombo | 0;
      base.correct = data.correct | 0;
      base.attempted = data.attempted | 0;
      base.exactTyped = data.exactTyped | 0;
      base.cleanMatches = data.cleanMatches | 0;
      base.theme = data.theme === "light" ? "light" : "dark";
      base.words = data.words && typeof data.words === "object" ? data.words : {};
      base.badges = data.badges && typeof data.badges === "object" ? data.badges : {};
      base.mocks = Array.isArray(data.mocks) ? data.mocks : [];

  function recordOutcome(wordId, outcome) {

  function runSelfTest() {
    var fails = [];

      check(wordsIn(list).length === 15, "list " + list + " count");
    });
    var seen = {};

      check(!seen[word.id], "duplicate " + word.id);

      check(word.def && word.example && word.example.toLowerCase().indexOf(word.word) !== -1, "example missing headword " + word.id);
      var defs = pickDistractors(word, "def");
      var names = pickDistractors(word, "word");
      check(defs.length === 3, "def distractors " + word.id);

      defs.concat(names).forEach(function (other) {

    check(gradeTyped("suplicate", "supplicate") === "close", "missing letter");
    check(gradeTyped("supplicat", "supplicate") === "close", "dropped end");
    check(gradeTyped("castigate", "diatribe") === "wrong", "other vocab word");
    check(gradeTyped("exacerbate", "encumber") === "wrong", "near pair not accepted");
    check(gradeTyped("mortify", "castigate") === "wrong", "mortify/castigate");
    check(gradeTyped("", "muse") === "empty", "empty");
    check(gradeTyped("musee", "muse") === "close", "muse extra letter");
    [41, 42, 43, 44, "all"].forEach(function (scope) {
      var rounds = chunkMatching(wordsIn(scope));
      var used = {};
      rounds.forEach(function (round) {

        });

    });

        ctx.font = "700 64px -apple-system, BlinkMacSystemFont, sans-serif";
        var headline = item ? (item.kind === "word" ? item.word.word : item.word.def) : "Round done";
        var lines = wrapText(ctx, headline, w - 96).slice(0, 4);
        lines.forEach(function (line, index) { ctx.fillText(line, 48, 120 + index * 76); });
        if (item && immer.phase === "feedback") {
          ctx.font = "600 32px -apple-system, BlinkMacSystemFont, sans-serif";
          ctx.fillStyle = immer.wasCorrect ? "#d8ffee" : "#ffd8d4";
          var why = (immer.wasCorrect ? "Correct. " : "Not quite. ") + item.word.word + " — " + item.word.def + ".";
          wrapText(ctx, why, w - 96).slice(0, 3).forEach(function (line, index) { ctx.fillText(line, 48, h - 180 + index * 40); });
        }
      }, 1480, 760);
      panel.add(new THREE.Mesh(new THREE.PlaneGeometry(1.52, 0.78), new THREE.MeshBasicMaterial({ map: tex })));
      var buttons = [];
      if (item) {
        immer.choices.forEach(function (choice, index) {
          var tone = "idle";
          if (immer.phase === "feedback") tone = choice.correct ? "right" : index === immer.picked ? "wrong" : "dim";
          buttons.push({ label: choice.text, tone: tone, action: { kind: "choice", index: index }, enabled: immer.phase === "ask" });
        });
      }
      if (immer.phase === "feedback") buttons.push({ label: immer.index + 1 >= immer.queue.length ? "Results" : "Next", tone: "next", action: { kind: "next" }, enabled: true });
      buttons.push({ label: "Exit", tone: "exit", action: { kind: "exit" }, enabled: true });
      var cursorY = -0.46;
      buttons.forEach(function (button) {
        var tall = button.label.length > 48;
        var h = tall ? 0.22 : 0.14;
        cursorY -= h / 2;
        var buttonTex = makeTexture(function (ctx, w, hgt) {
          ctx.clearRect(0, 0, w, hgt);
          ctx.fillStyle = button.tone === "right" ? "rgba(90,190,140,0.95)" : button.tone === "wrong" ? "rgba(176,72,68,0.95)" : button.tone === "next" ? "rgba(126,168,224,0.95)" : button.tone === "dim" ? "rgba(255,255,255,0.08)" : "rgba(255,255,255,0.16)";
          ctx.fillRect(0, 0, w, hgt);
          ctx.fillStyle = button.tone === "dim" ? "#b7c3d8" : "#f7f8fb";
          ctx.font = "600 " + (tall ? 36 : 46) + "px -apple-system, BlinkMacSystemFont, sans-serif";
          ctx.textBaseline = "top";
          wrapText(ctx, button.label, w - 70).slice(0, 3).forEach(function (line, index) { ctx.fillText(line, 36, 28 + index * (tall ? 42 : 52)); });
        }, 1400, tall ? 280 : 200);
        var mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.46, h), new THREE.MeshBasicMaterial({ map: buttonTex }));
        mesh.position.set(0, cursorY, 0.03);
        mesh.userData.action = button.action;
        mesh.userData.locked = !button.enabled;
        panel.add(mesh);
        hitTargets.push(mesh);
        cursorY -= h / 2 + 0.03;
      });
      panel.updateMatrixWorld(true);
    }

    function raycastSource(frame, source) {
      if (!frame || !source || !source.targetRaySpace) return null;
      var ref = renderer.xr.getReferenceSpace();
      if (!ref) return null;
      var pose = null;
      try { pose = frame.getPose(source.targetRaySpace, ref); } catch (err) { pose = null; }
      if (!pose) return null;
      var p = pose.transform.position;
      var o = pose.transform.orientation;
      var origin = new THREE.Vector3(p.x, p.y, p.z);
      var direction = new THREE.Vector3(0, 0, -1).applyQuaternion(new THREE.Quaternion(o.x, o.y, o.z, o.w)).normalize();
      raycaster.set(origin, direction);
      var hits = raycaster.intersectObjects(hitTargets, false);
      return hits.length ? hits[0].object.userData.action : null;
    }

    function activateAction(action) {
      if (!action || !immer.active || immer.mode !== "xr") return;
      var now = performance.now();
      if (now - lastActionAt < 280) return;
      lastActionAt = now;
      if (action.kind === "exit") immerExit();
      else if (action.kind === "next") immerNext();
      else if (action.kind === "choice") immerAnswer(action.index);
    }

    function placePanel(frame) {
      var ref = renderer.xr.getReferenceSpace();
      if (!ref) return;
      var pose = frame.getViewerPose(ref);
      if (!pose) return;
      var p = pose.transform.position;
      var o = pose.transform.orientation;
      var forward = new THREE.Vector3(0, 0, -1).applyQuaternion(new THREE.Quaternion(o.x, o.y, o.z, o.w));
      forward.y = 0;
      if (forward.lengthSq() < 1e-6) forward.set(0, 0, -1);
      else forward.normalize();
      panel.position.set(p.x, p.y - 0.15, p.z).addScaledVector(forward, 1.75);
      panel.lookAt(p.x, panel.position.y, p.z);
      floor.position.set(p.x, p.y - 1.45, p.z);
      panel.updateMatrixWorld(true);
      placed = true;
    }

    xrExtras.renderPanel = renderPanel;
    renderPanel();
    session.addEventListener("end", function () { xrAlive = false; finishImmersive(); });
    session.addEventListener("selectstart", function (event) {
      if (!isPointerSource(event.inputSource)) return;
      if (!raycastSource(latestFrame, event.inputSource)) selectQueue.push({ source: event.inputSource, kind: "hover" });
    });
    session.addEventListener("select", function (event) {
      if (!isPointerSource(event.inputSource)) return;
      var hit = raycastSource(latestFrame, event.inputSource);
      if (hit) activateAction(hit);
      else selectQueue.push({ source: event.inputSource, kind: "select" });
    });
    await renderer.xr.setSession(session);
    renderer.setAnimationLoop(function (time, frame) {
      if (!xrAlive) return;
      latestFrame = frame || null;
      if (frame && !placed) placePanel(frame);
      panel.visible = placed;
      if (frame && selectQueue.length) {
        selectQueue.splice(0, selectQueue.length).forEach(function (entry) {
          var hit = raycastSource(frame, entry.source);
          if (hit && entry.kind === "select") activateAction(hit);
        });
      }
      if (xrAlive) renderer.render(scene, camera);
    });
  }

  async function enterImmersive() {
    if (immer.active) return;
    if (immersiveKind === "xr" && navigator.xr && typeof navigator.xr.requestSession === "function") {
      var session = null;
      try {
        session = await navigator.xr.requestSession("immersive-vr", { optionalFeatures: ["local-floor"] });
      } catch (err) { session = null; }
      if (session) {
        try {
          var THREE = await import("https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js");
          await startXR(THREE, session);
          return;
        } catch (err) {
          try {
            var ending = session.end();
            if (ending && ending.catch) ending.catch(function () {});
          } catch (endErr) { /* closed */ }
          if (xrRenderer) {
            try { xrRenderer.dispose(); } catch (disposeErr) { /* ignore */ }
            xrRenderer = null;
          }
        }
      }
    }
    if (canUseFocus()) startFocus();
  }

  detectImmersive();
  render();
})();
</script>
</body>
</html>
