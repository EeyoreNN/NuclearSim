:root{--font:"Outfit",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--r1:10px;--r2:16px;--r3:22px;--r4:28px;--ease:cubic-bezier(.2,.9,.3,1.2);--spring:cubic-bezier(.34,1.56,.64,1);
--p0:#ff5d6c;--p0d:#c9364a;--p1:#2ee6f0;--p1d:#109cb0;--gold:#ffd23f;--ok:#2bd67b;--okd:#159a52;--bad:#ff4b5c;--badd:#b81f33;
--a0:#f43f5e;--a0d:#be123c;--a1:#3b82f6;--a1d:#1d4ed8;--a2:#f59e0b;--a2d:#b45309;--a3:#10b981;--a3d:#047857;--vio:#a78bfa;--viod:#6d28d9}
[data-theme=dark]{--bg:#0b0d1f;--bg2:#141735;--surface:#1a1e44;--surface2:#232860;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
--text:#f4f5ff;--muted:#a3a9d6;--dim:#7b81b5;--card:#fff;--cardtext:#151838;--cardline:#d9dcf3;--glow:rgba(124,58,237,.22);--grid:rgba(120,130,255,.07);--shadow:0 12px 34px -12px rgba(0,0,0,.6)}
[data-theme=light]{--bg:#eef0fb;--bg2:#e3e6f7;--surface:#ffffff;--surface2:#e6e9f7;--line:rgba(20,23,60,.09);--line2:rgba(20,23,60,.16);
--text:#14172b;--muted:#4f5680;--dim:#666c92;--card:#fff;--cardtext:#151838;--cardline:#d0d4ee;--glow:rgba(99,102,241,.16);--grid:rgba(80,90,200,.06);--shadow:0 10px 30px -12px rgba(20,23,60,.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.4;overflow-x:hidden;
background-image:radial-gradient(900px 520px at 85% -10%,var(--glow),transparent 70%),radial-gradient(700px 500px at -10% 110%,rgba(46,230,240,.08),transparent 70%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,transparent,#000 60%);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 60%);z-index:0}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--p1) 60%,transparent);outline-offset:2px}
sub{font-size:.68em;vertical-align:-.28em;line-height:0}sup{font-size:.66em;vertical-align:.55em;line-height:0}
#app{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:16px 16px 140px}
.kick{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.btn{--c:#2a2f6b;--cd:#151a45;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 20px;border-radius:var(--r2);font-weight:800;font-size:16px;background:var(--c);box-shadow:0 5px 0 var(--cd);transition:transform .12s var(--ease),box-shadow .12s,filter .15s;color:#fff}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cd)}
.btn.red{--c:var(--p0);--cd:var(--p0d);color:#2b0007}.btn.cyan{--c:var(--p1);--cd:var(--p1d);color:#06202a}.btn.gold{--c:var(--gold);--cd:#c99a00;color:#2a2000}.btn.green{--c:var(--ok);--cd:var(--okd);color:#04220f}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line2);color:var(--text)}.btn.ghost:active{transform:translateY(1px)}
.ico{width:20px;height:20px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:color-mix(in srgb,var(--surface) 80%,transparent);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--shadow)}
.hero{text-align:center;padding:26px 8px 10px}
.logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:6px}
.logo svg{width:56px;height:56px;filter:drop-shadow(0 6px 18px rgba(46,230,240,.35))}
h1{font-size:clamp(44px,9vw,68px);line-height:1;margin:0;font-weight:900;letter-spacing:-.02em;background:linear-gradient(92deg,var(--p0),#ff9a6c 35%,var(--gold) 55%,var(--p1) 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-weight:600;margin:8px 0 0}
.lvl{display:flex;align-items:center;gap:14px;padding:14px 16px;margin:18px 0}
.lvbadge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-weight:900;font-size:22px;background:linear-gradient(135deg,var(--vio),var(--p1));color:#0b0d1f;flex:none}
.xpbar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:6px}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff9a6c);border-radius:99px;transition:width .6s var(--ease)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mode{position:relative;text-align:left;padding:18px;border-radius:var(--r3);color:#fff;min-height:150px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 0 var(--cd);transition:transform .12s var(--ease),box-shadow .12s;overflow:hidden}
.mode:active{transform:translateY(5px);box-shadow:0 1px 0 var(--cd)}
.mode div{display:flex;flex-direction:column;gap:4px;position:relative;z-index:1}
.mode b{font-size:22px;font-weight:900}.mode span{font-size:14px;font-weight:600}.mode svg{width:34px;height:34px;flex:none}
.mode::after{content:"";position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
.m-duel{background:linear-gradient(135deg,#e8364f,#c22766);--cd:#8a1840}.m-prac{background:linear-gradient(135deg,#2f6fe0,#5b4be0);--cd:#25318f}.m-test{background:linear-gradient(135deg,#0b8f68,#0a8584);--cd:#05594b}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;padding:4px;border-radius:14px;background:var(--surface2);gap:4px}
.seg button{min-height:40px;min-width:44px;padding:6px 14px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.sect{margin-top:22px}.sect h2{font-size:15px;margin:0 0 10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}

const Q=[{"t":"mc","q":"Group 1 elements (Li, Na, K…) are called the…","a":"alkali metals","sets":[["alkaline earth metals","halogens","transition metals"],["noble gases","alkaline earth metals","metalloids"]],"why":"Group 1 = alkali metals. They lose 1 electron to form +1 ions.","sec":"ptable","id":"ptable-01","src":"Your notes"},{"t":"mc","q":"Group 2 elements (Be, Mg, Ca…) are called the…","a":"alkaline earth metals","sets":[["alkali metals","halogens","noble gases"],["transition metals","alkali metals","metalloids"]],"why":"Group 2 = alkaline earth metals. They lose 2 electrons to form +2 ions.","sec":"ptable","id":"ptable-02","src":"Your notes"},{"t":"mc","q":"Group 17 elements (F, Cl, Br, I) are called the…","a":"halogens","sets":[["noble gases","alkali metals","chalcogens"],["metalloids","alkaline earth metals","noble gases"]],"why":"Group 17 = halogens. They gain 1 electron to form −1 ions (fluoride, chloride…).","sec":"ptable","id":"ptable-03","src":"Your notes"},{"t":"mc","q":"Group 18 elements (He, Ne, Ar…) are called the…","a":"noble gases","sets":[["halogens","alkali metals","metalloids"],["halogens","alkaline earth metals","transition metals"]],"why":"Group 18 = noble gases. They already have a full outer shell, so they basically don’t form ions.","sec":"ptable","id":"ptable-04","src":"Your notes"},{"t":"mc","q":"What charge do Group 1 metals form as ions?","a":"+1","sets":[["+2","−1","+3"],["−1","+2","0"]],"why":"Group 1 loses 1 electron to match the previous noble gas → +1 (Na⁺, K⁺).","sec":"ptable","id":"ptable-05","src":"Your notes"},{"t":"mc","q":"What charge do Group 2 metals form as ions?","a":"+2","sets":[["+1","−2","+3"],["−2","+1","+4"]],"why":"Group 2 loses 2 electrons → +2 (Mg²⁺, Ca²⁺).","sec":"ptable","id":"ptable-06","src":"Your notes"},{"t":"mc","q":"What charge does a Group 13 metal like aluminum form?","a":"+3","sets":[["−3","+1","+2"],["+2","−5","+13"]],"why":"Group 13 loses 3 electrons → +3 (Al³⁺).","sec":"ptable","id":"ptable-07","src":"Your notes"},{"t":"mc","q":"What charge do Group 15 nonmetals (N, P) form?","a":"3−","sets":[["3+","5−","2−"],["5+","1−","2−"]],"why":"Group 15 gains 3 electrons to reach the next noble gas → 3− (N³⁻ nitride, P³⁻ phosphide).","sec":"ptable","id":"ptable-08","src":"Your notes"},{"t":"mc","q":"What charge do Group 16 nonmetals (O, S, Se) form?","a":"2−","sets":[["2+","6−","1−"],["6+","3−","1−"]],"why":"Group 16 gains 2 electrons → 2− (O²⁻ oxide, S²⁻ sulfide).","sec":"ptable","id":"ptable-09","src":"Your notes"},{"t":"mc","q":"What charge do Group 17 halogens form?","a":"1−","sets":[["1+","7−","2−"],["7+","2−","3−"]],"why":"Halogens gain 1 electron → 1− (F⁻, Cl⁻, Br⁻, I⁻).","sec":"ptable","id":"ptable-10","src":"Your notes"},{"t":"mc","q":"Which element is a metalloid?","a":"silicon (Si)","sets":[["carbon (C)","aluminum (Al)","phosphorus (P)"],["sulfur (S)","magnesium (Mg)","selenium (Se)"]],"why":"Metalloids sit along the staircase: B, Si, Ge, As, Sb, Te. Silicon is the classic one.","sec":"ptable","id":"ptable-11","src":"Your notes"},{"t":"mc","q":"Which element is a halogen?","a":"bromine (Br)","sets":[["sulfur (S)","argon (Ar)","barium (Ba)"],["oxygen (O)","neon (Ne)","boron (B)"]],"why":"Bromine is in Group 17, the halogens.","sec":"ptable","id":"ptable-12","src":"Your notes"},{"t":"mc","q":"Which element is an alkaline earth metal?","a":"strontium (Sr)","sets":[["sodium (Na)","scandium (Sc)","sulfur (S)"],["potassium (K)","aluminum (Al)","silver (Ag)"]],"why":"Strontium is in Group 2, the alkaline earth metals.","sec":"ptable","id":"ptable-13","src":"Your notes"},{"t":"mc","q":"Where are the nonmetals on the periodic table?","a":"upper right (right of the staircase), plus hydrogen","sets":[["left side and center","bottom two rows only","groups 3–12"],["only Group 18","left of the staircase","the middle block"]],"why":"Metals are left of the staircase line; nonmetals are to the upper right (hydrogen is a nonmetal too).","sec":"ptable","id":"ptable-14","src":"Your notes"},{"t":"mc","q":"The transition metals are in which groups?","a":"Groups 3–12","sets":[["Groups 1–2","Groups 13–16","Group 18 only"],["Groups 1–8","Groups 14–17","Groups 2–7"]],"why":"Groups 3–12 (the d-block) are the transition metals. Many have more than one possible charge, so names use Roman numerals.","sec":"ptable","id":"ptable-15","src":"Your notes"},{"t":"mc","q":"What ion does selenium (Se) form?","a":"Se²⁻","sets":[["Se²⁺","Se⁶⁻","Se⁻"],["Se⁶⁺","Se³⁻","Se⁺"]],"why":"Se is in Group 16 → gains 2 e⁻ → Se²⁻ (selenide).","sec":"ptable","id":"ptable-16","src":"Your notes"},{"t":"mc","q":"What ion does gallium (Ga) form?","a":"Ga³⁺","sets":[["Ga³⁻","Ga²⁺","Ga⁺"],["Ga⁵⁻","Ga²⁺","Ga⁴⁺"]],"why":"Ga is in Group 13 → loses 3 e⁻ → Ga³⁺.","sec":"ptable","id":"ptable-17","src":"Your notes"},{"t":"mc","q":"What ion does cesium (Cs) form?","a":"Cs⁺","sets":[["Cs²⁺","Cs⁻","Cs³⁺"],["Cs⁻","Cs²⁻","Cs²⁺"]],"why":"Cs is a Group 1 alkali metal → Cs⁺.","sec":"ptable","id":"ptable-18","src":"Your notes"},{"t":"mc","q":"Metals form ions by ____ electrons, making ____.","a":"losing · cations (+)","sets":[["gaining · anions (−)","losing · anions (−)","gaining · cations (+)"],["sharing · molecules","gaining · cations (+)","losing · anions (−)"]],"why":"Metals lose electrons → positive cations. Nonmetals gain electrons → negative anions.","sec":"ptable","id":"ptable-19","src":"Your notes"},{"t":"mc","q":"Why do Group 18 elements rarely form compounds or ions?","a":"They already have a full (stable) outer electron shell","sets":[["They are all radioactive","They are metals","They have no electrons"],["They are too heavy to react","They always form +8 ions","They are liquids"]],"why":"Noble gases already have the stable electron arrangement that other atoms gain/lose electrons to reach.","sec":"ptable","id":"ptable-20","src":"Your notes"},{"t":"mc","q":"Classify {MgO}","a":"ionic","opts":["ionic","molecular (covalent)","network covalent"],"why":"Mg is a metal + O is a nonmetal → ions (Mg²⁺, O²⁻) → ionic.","sec":"compounds","id":"compounds-01","src":"Your notes"},{"t":"mc","q":"Classify {CO2}","a":"molecular (covalent)","opts":["ionic","molecular (covalent)","network covalent"],"why":"C and O are both nonmetals → they share electrons → molecular. Dry ice is a molecular solid with a low melting point.","sec":"compounds","id":"compounds-02","src":"Your notes"},{"t":"mc","q":"Classify {NaCl}","a":"ionic","opts":["ionic","molecular (covalent)","network covalent"],"why":"Metal (Na) + nonmetal (Cl) → Na⁺ and Cl⁻ in a lattice → ionic, high melting point.","sec":"compounds","id":"compounds-03","src":"Your notes"},{"t":"mc","q":"Classify {CCl4}","a":"molecular (covalent)","opts":["ionic","molecular (covalent)","network covalent"],"why":"Nonmetals only → covalent bonds → discrete molecules → molecular.","sec":"compounds","id":"compounds-04","src":"Your notes"},{"t":"mc","q":"Classify {NH4Cl}","a":"ionic","opts":["ionic","molecular (covalent)","network covalent"],"why":"No metal, but NH₄⁺ (ammonium) is a cation → ionic. Dr. Laws marks ammonium compounds “I”.","sec":"compounds","id":"compounds-05","src":"Your notes"},{"t":"mc","q":"Classify {KNO3}","a":"ionic","opts":["ionic","molecular (covalent)","network covalent"],"why":"K⁺ (metal) + NO₃⁻ (polyatomic anion) → ionic.","sec":"compounds","id":"compounds-06","src":"Your notes"},{"t":"mc","q":"Classify {H2O}","a":"molecular (covalent)","opts":["ionic","molecular (covalent)","network covalent"],"why":"H and O are nonmetals sharing electrons → molecular, low melting point (0 °C).","sec":"compounds","id":"compounds-07","src":"Your notes"},{"t":"mc","q":"Classify {CaF2}","a":"ionic","opts":["ionic","molecular (covalent)","network covalent"],"why":"Ca²⁺ (metal) + F⁻ → ionic.","sec":"compounds","id":"compounds-08","src":"Your notes"},{"t":"mc","q":"Classify {N2O4}","a":"molecular (covalent)","opts":["ionic","molecular (covalent)","network covalent"],"why":"Two nonmetals → molecular (named with prefixes: dinitrogen tetroxide).","sec":"compounds","id":"compounds-09","src":"Your notes"},{"t":"mc","q":"Diamond (pure carbon, every atom covalently bonded in one giant network) is…","a":"network covalent","opts":["ionic","molecular (covalent)","network covalent"],"why":"Diamond is one continuous web of covalent bonds — no separate molecules. Melting means breaking covalent bonds → extremely high MP.","sec":"compounds","id":"compounds-10","src":"Your notes"},{"t":"mc","q":"Quartz, {SiO2}, is a giant 3-D web of Si–O covalent bonds. It is…","a":"network covalent","opts":["ionic","molecular (covalent)","network covalent"],"why":"SiO₂ (quartz/sand) is a network covalent solid: covalent bonds throughout, very high melting point. (Its name is still molecular-style: silicon dioxide.)","sec":"compounds","id":"compounds-11","src":"Your notes"},{"t":"mc","q":"Silicon carbide, {SiC}, is extremely hard with a melting point near 2700 °C and no separate molecules. It is…","a":"network covalent","opts":["ionic","molecular (covalent)","network covalent"],"why":"Hard + very high MP + nonmetals/metalloid bonded covalently in one network → network covalent.","sec":"compounds","id":"compounds-12","src":"Your notes"},{"t":"mc","q":"A substance melts at 801 °C, is brittle, and conducts electricity only when melted or dissolved. It is most likely…","a":"ionic","opts":["ionic","molecular (covalent)","network covalent"],"why":"High MP + conducts when molten (ions free to move) = ionic.","sec":"compounds","id":"compounds-13","src":"Your notes"},{"t":"mc","q":"A substance is a gas at room temperature and is made of only nonmetals. It is most likely…","a":"molecular (covalent)","opts":["ionic","molecular (covalent)","network covalent"],"why":"Molecular compounds have weak forces between molecules → low melting/boiling points (often gases or liquids).","sec":"compounds","id":"compounds-14","src":"Your notes"},{"t":"mc","q":"Which statement best describes an ionic compound?","a":"Made of + and − ions; overall net charge is zero; high melting point","sets":[["Nonmetals sharing electrons; low melting point","Atoms covalently bonded in one giant network","Made only of metal atoms sharing a sea of electrons"],["Has a net positive charge","Discrete molecules held by weak forces","Made only of noble gases"]],"why":"Ionic = cations + anions held by electrostatic attraction, charges balance to zero, high MP.","sec":"compounds","id":"compounds-15","src":"Your notes"},{"t":"mc","q":"A covalent bond is…","a":"a pair of electrons shared between two nonmetal atoms","sets":[["the transfer of electrons from a metal to a nonmetal","the attraction between a cation and an anion","a bond between two metal ions"],["a bond formed only in noble gases","the attraction between two cations","the loss of electrons by a metal"]],"why":"Covalent = shared electrons (nonmetal + nonmetal). Ionic = transferred electrons → ions attract.","sec":"compounds","id":"compounds-16","src":"Your notes"},{"t":"mc","q":"Why do ionic compounds have high melting points?","a":"Each ion is attracted to many oppositely charged neighbors in a lattice","sets":[["Each molecule is held together by strong covalent bonds","The cations repel each other strongly","They share electrons in a continuous network"],["They contain heavy atoms","Their molecules are very large","The anions attract each other"]],"why":"Melting an ionic solid means breaking many strong +/− attractions throughout the lattice.","sec":"compounds","id":"compounds-17","src":"Your notes"},{"t":"mc","q":"Molecular compounds typically have ____ melting points because ____.","a":"low · the forces BETWEEN molecules are weak","sets":[["high · covalent bonds are strong","low · they contain ions","high · ions attract each other"],["high · they form a lattice","low · covalent bonds are weak","high · they share electrons"]],"why":"Melting a molecular solid only separates molecules (weak forces) — the covalent bonds inside each molecule don’t break.","sec":"compounds","id":"compounds-18","src":"Your notes"},{"t":"mc","q":"Formula of the <b>hydrogen sulfite</b> ion?","a":"HSO3^-","af":1,"sets":[["SO3^2-","HSO4^-","HSO3^2-"],["HSO4^-","H2SO3^-","HS^-"]],"why":"Hydrogen + sulfite (SO₃²⁻) → HSO₃⁻: adding H⁺ raises the charge by one (2− → 1−).","src":"HW #16 Part 1","sec":"ions","id":"ions-01"},{"t":"mc","q":"Formula of the <b>periodate</b> ion?","a":"IO4^-","af":1,"sets":[["IO3^-","IO^-","IO4^2-"],["IO2^-","I^-","IO3^-"]],"why":"per…ate = one more O than iodate (IO₃⁻) → IO₄⁻, same 1− charge.","src":"HW #16 Part 1","sec":"ions","id":"ions-02"},{"t":"mc","q":"Formula of the <b>phosphate</b> ion?","a":"PO4^3-","af":1,"sets":[["PO3^3-","PO4^2-","HPO4^2-"],["P^3-","PO4^-","PO3^3-"]],"why":"Phosphate = PO₄³⁻ (phosphite has one less O: PO₃³⁻).","src":"HW #16 Part 1","sec":"ions","id":"ions-03"},{"t":"mc","q":"Formula of the <b>acetate</b> ion?","a":"C2H3O2^-","af":1,"sets":[["CO3^2-","C2H3O2^2-","CH3^-"],["C2O4^2-","HCO3^-","C2H3O^-"]],"why":"Acetate = C₂H₃O₂⁻ (1−).","src":"HW #16 Part 1","sec":"ions","id":"ions-04"},{"t":"mc","q":"Formula of the <b>chromate</b> ion?","a":"CrO4^2-","af":1,"sets":[["Cr2O7^2-","CrO4^-","CrO3^2-"],["Cr2O7^2-","CrO4^3-","MnO4^-"]],"why":"Chromate = CrO₄²⁻. Dichromate is Cr₂O₇²⁻.","src":"HW #16 Part 1","sec":"ions","id":"ions-05"},{"t":"mc","q":"Formula of the <b>cyanide</b> ion?","a":"CN^-","af":1,"sets":[["CN^2-","CNO^-","C^4-"],["SCN^-","CN^+","NO2^-"]],"why":"Cyanide = CN⁻.","src":"HW #16 Part 1","sec":"ions","id":"ions-06"},{"t":"mc","q":"Formula of the <b>hypobromite</b> ion?","a":"BrO^-","af":1,"sets":[["BrO2^-","BrO3^-","Br^-"],["BrO4^-","BrO^2-","BrO2^-"]],"why":"hypo…ite = one less O than bromite (BrO₂⁻) → BrO⁻.","src":"HW #16 Part 1","sec":"ions","id":"ions-07"},{"t":"mc","q":"Formula of the <b>sulfate</b> ion?","a":"SO4^2-","af":1,"sets":[["SO3^2-","SO4^-","HSO4^-"],["S^2-","SO4^3-","SO3^2-"]],"why":"Sulfate = SO₄²⁻ (sulfite = SO₃²⁻).","src":"HW #16 Part 1","sec":"ions","id":"ions-08"},{"t":"mc","q":"Formula of the <b>hydroxide</b> ion?","a":"OH^-","af":1,"sets":[["O^2-","OH^2-","H3O^+"],["O2^2-","HO2^-","OH^+"]],"why":"Hydroxide = OH⁻.","src":"HW #16 Part 1","sec":"ions","id":"ions-09"},{"t":"mc","q":"Formula of the <b>permanganate</b> ion?","a":"MnO4^-","af":1,"sets":[["MnO4^2-","MnO3^-","CrO4^2-"],["MnO2^-","Mn^2+","MnO4^3-"]],"why":"Permanganate = MnO₄⁻.","src":"HW #16 Part 1","sec":"ions","id":"ions-10"},{"t":"mc","q":"Formula of the <b>nitrite</b> ion?","a":"NO2^-","af":1,"sets":[["NO3^-","NO2^2-","N^3-"],["NO3^-","NO^-","N2O^-"]],"why":"-ite = one less O than -ate: nitrate NO₃⁻ → nitrite NO₂⁻.","src":"Polyatomic ion sheet","sec":"ions","id":"ions-11"},{"t":"mc","q":"Formula of the <b>chlorate</b> ion?","a":"ClO3^-","af":1,"sets":[["ClO4^-","ClO2^-","ClO3^2-"],["ClO^-","Cl^-","ClO4^-"]],"why":"Chlorate = ClO₃⁻. Family: ClO₄⁻ perchlorate, ClO₃⁻ chlorate, ClO₂⁻ chlorite, ClO⁻ hypochlorite.","src":"Polyatomic ion sheet","sec":"ions","id":"ions-12"},{"t":"mc","q":"Formula of the <b>hypochlorite</b> ion?","a":"ClO^-","af":1,"sets":[["ClO2^-","Cl^-","ClO3^-"],["ClO4^-","ClO^2-","ClO2^-"]],"why":"hypochlorite = ClO⁻ (one less O than chlorite ClO₂⁻).","src":"Polyatomic ion sheet","sec":"ions","id":"ions-13"},{"t":"mc","q":"Formula of the <b>dichromate</b> ion?","a":"Cr2O7^2-","af":1,"sets":[["CrO4^2-","Cr2O7^-","Cr2O4^2-"],["CrO7^2-","Cr2O7^3-","CrO4^2-"]],"why":"Dichromate = Cr₂O₇²⁻.","src":"Polyatomic ion sheet","sec":"ions","id":"ions-14"},{"t":"mc","q":"Formula of the <b>peroxide</b> ion?","a":"O2^2-","af":1,"sets":[["O^2-","O2^-","OH^-"],["O^2-","O3^2-","O2^+"]],"why":"Peroxide = O₂²⁻. Never reduce it: Na₂O₂ is sodium peroxide, not sodium oxide.","src":"Polyatomic ion sheet","sec":"ions","id":"ions-15"},{"t":"mc","q":"Formula of the <b>hydrogen carbonate</b> ion?","a":"HCO3^-","af":1,"sets":[["CO3^2-","HCO3^2-","H2CO3^-"],["HCO2^-","CO3^-","C2H3O2^-"]],"why":"Hydrogen carbonate (bicarbonate) = HCO₃⁻: carbonate CO₃²⁻ + H⁺.","src":"Polyatomic ion sheet","sec":"ions","id":"ions-16"},{"t":"mc","q":"Formula of the <b>hydrogen phosphate</b> ion?","a":"HPO4^2-","af":1,"sets":[["PO4^3-","HPO4^-","H2PO4^2-"],["HPO3^2-","PO4^2-","HPO4^3-"]],"why":"Hydrogen phosphate = HPO₄²⁻: phosphate (3−) + H⁺ → 2−.","src":"Polyatomic ion sheet","sec":"ions","id":"ions-17"},{"t":"mc","q":"Which is the only common polyatomic CATION on the list?","a":"NH4^+","af":1,"sets":[["NH3","OH^-","H3O^-"],["NO3^-","NH4^-","CN^-"]],"why":"Ammonium, NH₄⁺, is the cation. Don’t confuse it with ammonia, NH₃ (a neutral molecule).","src":"Polyatomic ion sheet","sec":"ions","id":"ions-18"},{"t":"mc","q":"Name the ion {CO3^2-}","a":"carbonate","sets":[["carbonite","hydrogen carbonate","carbide"],["carbonite","bicarbonate","percarbonate"]],"why":"CO₃²⁻ = carbonate.","src":"Polyatomic ion sheet","sec":"ions","id":"ions-19"},{"t":"mc","q":"Name the ion {ClO4^-}","a":"perchlorate","sets":[["chlorate","hypochlorite","chlorite"],["chlorate","chloride","perchlorite"]],"why":"Four O = per…ate → perchlorate.","src":"Polyatomic ion sheet","sec":"ions","id":"ions-20"},{"t":"mc","q":"Name the ion {SO3^2-}","a":"sulfite","sets":[["sulfate","sulfide","hydrogen sulfite"],["sulfate","persulfate","hyposulfite"]],"why":"Sulfate SO₄²⁻ minus one O = sulfite SO₃²⁻.","src":"Polyatomic ion sheet","sec":"ions","id":"ions-21"},{"t":"mc","q":"Name the ion {IO2^-}","a":"iodite","sets":[["iodate","hypoiodite","iodide"],["periodate","iodate","hypoiodite"]],"why":"Iodate is IO₃⁻; one less O → iodite IO₂⁻.","src":"Polyatomic ion sheet","sec":"ions","id":"ions-22"},{"t":"mc","q":"Name the ion {PO3^3-}","a":"phosphite","sets":[["phosphate","phosphide","hydrogen phosphate"],["phosphate","hypophosphite","perphosphate"]],"why":"Phosphate is PO₄³⁻; one less O → phosphite PO₃³⁻.","src":"Polyatomic ion sheet","sec":"ions","id":"ions-23"},{"t":"mc","q":"Adding “hydrogen” to the front of an ion name (e.g. sulfate → hydrogen sulfate) does what to the formula?","a":"Adds one H and raises the charge by +1 (SO₄²⁻ → HSO₄⁻)","sets":[["Adds one H and keeps the same charge","Removes one O","Adds one H and lowers the charge by 1 (SO₄²⁻ → HSO₄³⁻)"],["Doubles the formula","Adds H₂ and keeps the charge","Changes -ate to -ite"]],"why":"H⁺ carries +1, so the ion’s charge goes up by one: CO₃²⁻ → HCO₃⁻, PO₄³⁻ → HPO₄²⁻.","src":"Polyatomic ion sheet","sec":"ions","id":"ions-24"},{"t":"mc","q":"Write the formula: <b>aluminum sulfide</b>","a":"Al2S3","af":1,"sets":[["AlS","Al3S2","AlS2"],["Al3S2","AlS2","Al2S"]],"why":"Ions: aluminum = charge +3; sulfide = S with charge −2. Criss-cross the charges → Al2S3. Check: 2(+3) + 3(−2) = 0.","src":"Your notes","mode":"formula","sec":"n2f","id":"n2f-01"},{"t":"type","q":"Write the formula: <b>calcium nitride</b>","a":"Ca3N2","af":1,"sets":[["Ca2N3","CaN","CaN2"],["CaN","CaN2","Ca2N"]],"why":"Ions: calcium = charge +2; nitride = N with charge −3. Criss-cross the charges → Ca3N2. Check: 3(+2) + 2(−3) = 0.","src":"Your notes","mode":"formula","sec":"n2f","id":"n2f-02"},{"t":"mc","q":"Write the formula: <b>magnesium phosphate</b>","a":"Mg3(PO4)2","af":1,"sets":[["Mg2(PO4)3","Mg3PO42","MgPO4"],["Mg3PO42","MgPO4","Mg3(PO3)2"]],"why":"Ions: magnesium = charge +2; phosphate = PO4 with charge −3. Criss-cross the charges → Mg3(PO4)2. Check: 3(+2) + 2(−3) = 0. Parentheses because there are 2+ polyatomic ions.","src":"Your notes","mode":"formula","sec":"n2f","id":"n2f-03"},{"t":"mc","q":"Write the formula: <b>iron(III) oxide</b>","a":"Fe2O3","af":1,"sets":[["Fe3O2","FeO","FeO3"],["FeO","FeO3","FeO2"]],"why":"Ions: iron = charge +3 (Roman numeral); oxide = O with charge −2. Criss-cross the charges → Fe2O3. Check: 2(+3) + 3(−2) = 0.","src":"Your notes","mode":"formula","sec":"n2f","id":"n2f-04"},{"t":"type","q":"Write the formula: <b>iron(II) sulfate</b>","a":"FeSO4","af":1,"sets":[["FeSO3","Fe2(SO4)2","Fe(SO4)2"],["Fe2(SO4)2","Fe(SO4)2","Fe2SO4"]],"why":"Ions: iron = charge +2 (Roman numeral); sulfate = SO4 with charge −2. Criss-cross → Fe2(SO4)2 → reduce → FeSO4. Check: 1(+2) + 1(−2) = 0.","src":"Your notes","mode":"formula","sec":"n2f","id":"n2f-05"},{"t":"mc","q":"Write the formula: <b>copper(II) hydroxide</b>","a":"Cu(OH)2","af":1,"sets":[["CuOH2","Cu2OH","CuOH"],["Cu2OH","CuOH","Cu3(OH)2"]],"why":"Ions: copper = charge +2 (Roman numeral); hydroxide = OH with charge −1. Criss-cross the charges → Cu(OH)2. Check: 1(+2) + 2(−1) = 0. Parentheses because there are 2+ polyatomic ions.","src":"Your notes","mode":"formula","sec":"n2f","id":"n2f-06"},{"t":"mc","q":"Write the formula: <b>ammonium sulfate</b>","a":"(NH4)2SO4","af":1,"sets":[["NH4(SO4)2","NH4SO4","(NH4)2SO3"],["NH4SO4","(NH4)2SO3","(NH3)2SO4"]],"why":"Ions: ammonium = charge +1; sulfate = SO4 with charge −2. Criss-cross the charges → (NH4)2SO4. Check: 2(+1) + 1(−2) = 0.","src":"Your notes","mode":"formula","sec":"n2f","id":"n2f-07"},{"t":"type","q":"Write the formula: <b>ammonium phosphate</b>","a":"(NH4)3PO4","af":1,"sets":[["NH4(PO4)3","(NH3)3PO4","NH4PO4"],["(NH3)3PO4","NH4PO4","(NH4)3PO3"]],"why":"Ions: ammonium = charge +1; phosphate = PO4 with charge −3. Criss-cross the charges → (NH4)3PO4. Check: 3(+1) + 1(−3) = 0.","src":"Your notes","mode":"formula","sec":"n2f","id":"n2f-08"},{"t":"mc","q":"Write the formula: <b>sodium hydrogen carbonate</b>","a":"NaHCO3","af":1,"sets":[["Na(HCO3)2","Na2HCO3","Na3(HCO3)2"],["Na2HCO3","Na3(HCO3)2","Na2(HCO3)3"]],"why":"Ions: sodium = charge +1; hydrogen carbonate = HCO3 with charge −1. Criss-cross the charges → NaHCO3. Check: 1(+1) + 1(−1) = 0.","src":"Your notes","mode":"formula","sec":"n2f","id":"n2f-09"},{"t":"mc","q":"Write the formula: <b>potassium permanganate</b>","a":"KMnO4","af":1,"sets":[["K(MnO4)2","K2MnO4","K3(MnO4)2"],["K2MnO4","K3(MnO4)2","K2(MnO4)3"]],"why":"Ions: potassium = charge +1; permanganate = MnO4 with charge −1. Criss-cross the charges → KMnO4. Check: 1(+1) + 1(−1) = 0.","src":"Your notes","mode":"formula","sec":"n2f","id":"n2f-10"},{"t":"type","q":"Write the formula: <b>calcium acetate</b> ron(II) nitrite","iron trinitrite"]],"why":"3 × NO₂⁻ = −3 → Fe is +3. NO₂⁻ is nitrITE (nitrate is NO₃⁻).","src":"Self-quiz","sec":"f2n","id":"f2n-48"},{"t":"mc","q":"When do you use prefixes (di-, tri-…) in a name?","a":"Only for molecular compounds (two nonmetals)","sets":[["Only for ionic compounds","For every compound","Only for transition metals"],["Only when there are polyatomic ions","Only for compounds with oxygen","For ionic compounds with 2+ of an ion"]],"why":"Prefixes = molecular. Ionic names never use prefixes — the charges determine the ratio.","sec":"f2n","id":"f2n-49","src":"Your notes"},{"t":"mc","q":"The Roman numeral in iron(III) oxide tells you…","a":"the charge on each iron ion (+3)","sets":[["the number of iron atoms (3)","the number of oxygen atoms (3)","the total charge of the compound"],["the group number of iron","that there are 3 oxide ions","the number of electrons shared"]],"why":"The numeral is the cation’s charge, not a subscript. Fe³⁺ + O²⁻ → Fe₂O₃.","sec":"f2n","id":"f2n-50","src":"Your notes"},{"t":"num","q":"How many atoms are in <b>10.0 g</b> of {S} (32.07 g/mol)?","a":"1.88 × 10^23","val":1.877767383847833e+23,"unit":"atoms","dist":["6.02 × 10^24","0.312","1.93 × 10^26"],"why":"Always go through moles. 10.0 g ÷ 32.07 g/mol = 0.3118 mol; × 6.022 × 10²³ = 1.88 × 10^23 atoms.","src":"Your notes (worked example)","sec":"moles","id":"moles-01"},{"t":"num","q":"How many moles are in <b>65.7 g</b> of {H2O}?","a":"3.65","val":3.646758436944938,"unit":"mol","dist":["1.18 × 10^3","0.274","2.20 × 10^24"],"why":"Molar mass: 2(1.008) + 16.00 = 18.02 g/mol. Moles = grams ÷ molar mass = 65.7 ÷ 18.02 = 3.65 mol.","src":"HW #17 Q1","sec":"moles","id":"moles-02"},{"t":"num","q":"What is the mass of <b>0.481 mol</b> of carbon dioxide?","a":"21.2","val":21.168809999999997,"unit":"g","dist":["0.0109","91.5","42.3"],"why":"Molar mass: 12.01 + 2(16.00) = 44.01 g/mol. Grams = moles × molar mass = 0.481 × 44.01 = 21.2 g.","src":"HW #17 Q2","sec":"moles","id":"moles-03"},{"t":"num","q":"How many atoms are in <b>51.3 g</b> of {Fe} (55.85 g/mol)?","a":"5.53 × 10^23","val":5.5313983885407336e+23,"unit":"atoms","dist":["3.09 × 10^25","0.919","1.73 × 10^27"],"why":"Always go through moles. 51.3 g ÷ 55.85 g/mol = 0.9185 mol; × 6.022 × 10²³ = 5.53 × 10^23 atoms.","src":"HW #17 Q3","sec":"moles","id":"moles-04"},{"t":"num","q":"What is the mass of <b>1.35 × 10^25</b> molecules of dinitrogen trioxide?","a":"1.70 × 10^3","val":1704.2012620391895,"unit":"g","dist":["22.4","1.03 × 10^27","3.39"],"why":"Particles → moles: 1.35 × 10^25 ÷ 6.022 × 10²³ = 22.42 mol. Molar mass: 2(14.01) + 3(16.00) = 76.02 g/mol. Grams = 22.42 × 76.02 = 1.70 × 10^3 g.","src":"HW #17 Q4","sec":"moles","id":"moles-05"},{"t":"num","q":"How many moles are in <b>25.0 g</b> of {NaCl}?","a":"0.428","val":0.4277891854893908,"unit":"mol","dist":["1.46 × 10^3","2.34","2.58 × 10^23"],"why":"Molar mass: 22.99 + 35.45 = 58.44 g/mol. Moles = grams ÷ molar mass = 25.0 ÷ 58.44 = 0.428 mol.","src":"Your notes","sec":"moles","id":"moles-06"},{"t":"num","q":"What is the mass of <b>0.250 mol</b> of {CaCO3}?","a":"25.0","val":25.0225,"unit":"g","dist":["2.50 × 10^-3","400","50.0"],"why":"Molar mass: 40.08 + 12.01 + 3(16.00) = 100.09 g/mol. Grams = moles × molar mass = 0.250 × 100.09 = 25.0 g.","src":"Your notes","sec":"moles","id":"moles-07"},{"t":"num","q":"How many atoms are in <b>12.0 g</b> of {Mg} (24.31 g/mol)?","a":"2.97 × 10^23","val":2.972603866721514e+23,"unit":"atoms","dist":["7.23 × 10^24","0.494","1.76 × 10^26"],"why":"Always go through moles. 12.0 g ÷ 24.31 g/mol = 0.4936 mol; × 6.022 × 10²³ = 2.97 × 10^23 atoms.","src":"Self-quiz","sec":"moles","id":"moles-08"},{"t":"num","q":"How many moles are in <b>50.0 g</b> of {CH4}?","a":"3.12","val":3.1168183518264554,"unit":"mol","dist":["802","0.321","1.88 × 10^24"],"why":"Molar mass: 12.01 + 4(1.008) = 16.04 g/mol. Moles = grams ÷ molar mass = 50.0 ÷ 16.04 = 3.12 mol.","src":"Self-quiz","sec":"moles","id":"moles-09"},{"t":"num","q":"How many moles are in <b>100.0 g</b> of {C6H12O6}?","a":"0.555","val":0.5550744909966917,"unit":"mol","dist":["1.80 × 10^4","1.80","3.34 × 10^23"],"why":"Molar mass: 6(12.01) + 12(1.008) + 6(16.00) = 180.16 g/mol. Moles = grams ÷ molar mass = 100.0 ÷ 180.16 = 0.555 mol.","src":"Your notes","sec":"moles","id":"moles-10"},{"t":"num","q":"How many molecules are in <b>0.750 mol</b> of {O2}?","a":"4.52 × 10^23","val":4.5165e+23,"unit":"molecules","dist":["1.25 × 10^-24","24.0","4.52 × 10^24"],"why":"Particles = moles × 6.022 × 10²³ = 0.750 × 6.022 × 10²³ = 4.52 × 10^23 molecules.","src":"Your notes","sec":"moles","id":"moles-11"},{"t":"num","q":"How many moles are in <b>3.01 × 10^23</b> molecules of {CO2}?","a":"0.500","val":0.4998339422118897,"unit":"mol","dist":["22.0","5.00","2.00"],"why":"Moles = particles ÷ 6.022 × 10²³ = 3.01 × 10^23 ÷ 6.022 × 10²³ = 0.500 mol.","src":"Your notes","sec":"moles","id":"moles-12"},{"t":"num","q":"What is the mass of <b>3.01 × 10^23</b> molecules of {SO2}?","a":"32.0","val":32.02436067751577,"unit":"g","dist":["0.500","1.93 × 10^25","128"],"why":"Particles → moles: 3.01 × 10^23 ÷ 6.022 × 10²³ = 0.4998 mol. Molar mass: 32.07 + 2(16.00) = 64.07 g/mol. Grams = 0.4998 × 64.07 = 32.0 g.","src":"Your notes","sec":"moles","id":"moles-13"},{"t":"num","q":"How many atoms are in <b>5.00 g</b> of {Al} (26.98 g/mol)?","a":"1.12 × 10^23","val":1.1160118606375093e+23,"unit":"atoms","dist":["3.01 × 10^24","0.185","8.12 × 10^25"],"why":"Always go through moles. 5.00 g ÷ 26.98 g/mol = 0.1853 mol; × 6.022 × 10²³ = 1.12 × 10^23 atoms.","src":"Your notes","sec":"moles","id":"moles-14"},{"t":"num","q":"What is the mass of <b>2.50 mol</b> of {NaOH}?","a":"100","val":99.99499999999999,"unit":"g","dist":["0.0625","16.0","200"],"why":"Molar mass: 22.99 + 16.00 + 1.008 = 40.00 g/mol. Grams = moles × molar mass = 2.50 × 40.00 = 100 g.","src":"Your notes","sec":"moles","id":"moles-15"},{"t":"num","q":"How many formula units are in <b>1.50 mol</b> of {NaCl}?","a":"9.03 × 10^23","val":9.033e+23,"unit":"formula units","dist":["2.49 × 10^-24","87.7","9.03 × 10^24"],"why":"Particles = moles × 6.022 × 10²³ = 1.50 × 6.022 × 10²³ = 9.03 × 10^23 formula units.","src":"Your notes","sec":"moles","id":"moles-16"},{"t":"num","q":"How many moles are in <b>16.0 g</b> of {O2}?","a":"0.500","val":0.5,"unit":"mol","dist":["512","2.00","3.01 × 10^23"],"why":"Molar mass: 2(16.00) = 32.00 g/mol. Moles = grams ÷ molar mass = 16.0 ÷ 32.00 = 0.500 mol.","src":"Your notes","sec":"moles","id":"moles-17"},{"t":"num","q":"How many moles are in <b>1.20 × 10^24</b> atoms of {Cu}?","a":"1.99","val":1.9926934573231485,"unit":"mol","dist":["127","19.9","0.502"],"why":"Moles = particles ÷ 6.022 × 10²³ = 1.20 × 10^24 ÷ 6.022 × 10²³ = 1.99 mol.","src":"Your notes","sec":"moles","id":"moles-18"},{"t":"mc","q":"Molar mass of {Ca(NO3)2}?","a":"164.10 g/mol","sets":[["70.09 g/mol","102.09 g/mol","328.20 g/mol"],["102.09 g/mol","328.20 g/mol","148.10 g/mol"]],"why":"Add up atomic masses × subscripts (everything inside parentheses gets multiplied): 40.08 + 2(14.01) + 6(16.00) = 164.10 g/mol.","src":"Your notes","sec":"moles","id":"moles-19"},{"t":"mc","q":"Molar mass of {(NH4)2SO4}?","a":"132.15 g/mol","sets":[["63.09 g/mol","114.11 g/mol","264.31 g/mol"],["114.11 g/mol","264.31 g/mol","116.15 g/mol"]],"why":"Add up atomic masses × subscripts (everything inside parentheses gets multiplied): 2(14.01) + 8(1.008) + 32.07 + 4(16.00) = 132.15 g/mol.","src":"Your notes","sec":"moles","id":"moles-20"},{"t":"mc","q":"Molar mass of {Al2(SO4)3}?","a":"342.17 g/mol","sets":[["75.05 g/mol","150.03 g/mol","684.34 g/mol"],["150.03 g/mol","684.34 g/mol","326.17 g/mol"]],"why":"Add up atomic masses × subscripts (everything inside parentheses gets multiplied): 2(26.98) + 3(32.07) + 12(16.00) = 342.17 g/mol.","src":"Your notes","sec":"moles","id":"moles-21"},{"t":"mc","q":"Molar mass of {Mg(OH)2}?","a":"58.33 g/mol","sets":[["41.32 g/mol","116.65 g/mol","42.33 g/mol"],["41.32 g/mol","116.65 g/mol","42.33 g/mol"]],"why":"Add up atomic masses × subscripts (everything inside parentheses gets multiplied): 24.31 + 2(16.00) + 2(1.008) = 58.33 g/mol.","src":"Your notes","sec":"moles","id":"moles-22"},{"t":"mc","q":"Molar mass of {C6H12O6}?","a":"180.16 g/mol","sets":[["29.02 g/mol","360.31 g/mol","164.16 g/mol"],["29.02 g/mol","360.31 g/mol","164.16 g/mol"]],"why":"Add up atomic masses × subscripts (everything inside parentheses gets multiplied): 6(12.01) + 12(1.008) + 6(16.00) = 180.16 g/mol.","src":"Your notes","sec":"moles","id":"moles-23"},{"t":"mc","q":"Molar mass of {N2O3}?","a":"76.02 g/mol","sets":[["30.01 g/mol","152.04 g/mol","60.02 g/mol"],["30.01 g/mol","152.04 g/mol","60.02 g/mol"]],"why":"Add up atomic masses × subscripts (everything inside parentheses gets multiplied): 2(14.01) + 3(16.00) = 76.02 g/mol.","src":"Your notes","sec":"moles","id":"moles-24"},{"t":"mc","q":"Avogadro’s number is…","a":"6.022 × 10²³ particles per mole","sets":[["6.022 × 10⁻²³ particles per mole","6.022 × 10²³ grams per mole","22.4 particles per mole"],["1.66 × 10⁻²⁴ particles per mole","6.022 × 10²² particles per mole","6.022 × 10²³ moles per gram"]],"why":"1 mol = 6.022 × 10²³ particles (atoms, molecules, or formula units).","sec":"moles","id":"moles-25","src":"Your notes"},{"t":"mc","q":"To convert GRAMS → MOLES you…","a":"divide by the molar mass","sets":[["multiply by the molar mass","multiply by 6.022 × 10²³","divide by 6.022 × 10²³"],["multiply by the molar mass","divide by 22.4","multiply by Avogadro’s number"]],"why":"grams ÷ (g/mol) = mol. The grams cancel.","sec":"moles","id":"moles-26","src":"Your notes"},{"t":"mc","q":"To convert MOLES → PARTICLES you…","a":"multiply by 6.022 × 10²³","sets":[["divide by 6.022 × 10²³","multiply by the molar mass","divide by the molar mass"],["divide by 6.022 × 10²³","multiply by 22.4","divide by the molar mass"]],"why":"mol × (6.022 × 10²³ particles/mol) = particles.","sec":"moles","id":"moles-27","src":"Your notes"},{"t":"mc","q":"How do you get from grams of a substance to number of atoms?","a":"grams → moles (÷ molar mass) → atoms (× 6.022 × 10²³)","sets":[["grams × 6.022 × 10²³ in one step","grams → atoms (÷ 6.022 × 10²³)","grams × molar mass → atoms"],["grams ÷ 6.022 × 10²³ → moles → atoms","grams × molar mass × 6.022 × 10²³","atoms are the same as grams"]],"why":"The mole is the hub of the diagram: you can never go straight from grams to particles.","sec":"moles","id":"moles-28","src":"Your notes"},{"t":"mc","q":"For an ionic compound like NaCl, the “particles” counted with Avogadro’s number are called…","a":"formula units","sets":[["molecules","atoms","moles"],["molecules","isotopes","nuclei"]],"why":"Ionic compounds don’t form molecules; one Na⁺ + one Cl⁻ is a formula unit. Molecular compounds → molecules; elements → atoms.","sec":"moles","id":"moles-29","src":"Your notes"},{"t":"num","q":"Mass percent of <b>N</b> in {N2O}?","a":"63.65","val":63.65288505224898,"unit":"%","dist":["31.83%","66.67%","36.35%"],"why":"Molar mass: 2(14.01) + 16.00 = 44.02 g/mol. Mass of N in 1 mol = 2×14.01 = 28.02 g. % = 28.02 ÷ 44.02 × 100 = 63.65%.","src":"HW #17 Q5a","pctmode":1,"sec":"percent","id":"percent-01"},{"t":"num","q":"Mass percent of <b>O</b> in {N2O}?","a":"36.35","val":36.347114947751024,"unit":"%","dist":["33.33%","63.65%","54.52%"],"why":"Molar mass: 2(14.01) + 16.00 = 44.02 g/mol. Mass of O in 1 mol = 16.00 = 16.00 g. % = 16.00 ÷ 44.02 × 100 = 36.35%.","src":"HW #17 Q5a","pctmode":1,"sec":"percent","id":"percent-02"},{"t":"num","q":"Mass percent of <b>C</b> in {C6H12O6}?","a":"40.00","val":39.99866782122161,"unit":"%","dist":["6.67%","25.00%","60.00%"],"why":"Molar mass: 6(12.01) + 12(1.008) + 6(16.00) = 180.16 g/mol. Mass of C in 1 mol = 6×12.01 = 72.06 g. % = 72.06 ÷ 180.16 × 100 = 40.00%.","src":"HW #17 Q5b","pctmode":1,"sec":"percent","id":"percent-03"},{"t":"num","q":"Mass percent of <b>H</b> in {C6H12O6}?","a":"6.71","val":6.714181043095984,"unit":"%","dist":["0.56%","50.00%","93.29%"],"why":"Molar mass: 6(12.01) + 12(1.008) + 6(16.00) = 180.16 g/mol. Mass of H in 1 mol = 12×1.01 = 12.10 g. % = 12.10 ÷ 180.16 × 100 = 6.71%.","src":"HW #17 Q5b","pctmode":1,"sec":"percent","id":"percent-04"},{"t":"num","q":"Mass percent of <b>O</b> in {C6H12O6}?","a":"53.29","val":53.28715113568241,"unit":"%","dist":["8.88%","25.00%","46.71%"],"why":"Molar mass: 6(12.01) + 12(1.008) + 6(16.00) = 180.16 g/mol. Mass of O in 1 mol = 6×16.00 = 96.00 g. % = 96.00 ÷ 180.16 × 100 = 53.29%.","src":"HW #17 Q5b","pctmode":1,"sec":"percent","id":"percent-05"},{"t":"num","q":"Mass percent of <b>N</b> in {NH4NO3}?","a":"35.00","val":35.00224853845001,"unit":"%","dist":["17.50%","22.22%","65.00%"],"why":"Molar mass: 2(14.01) + 4(1.008) + 3(16.00) = 80.05 g/mol. Mass of N in 1 mol = 2×14.01 = 28.02 g. % = 28.02 ÷ 80.05 × 100 = 35.00%.","src":"Self-quiz","pctmode":1,"sec":"percent","id":"percent-06"},{"t":"num","q":"Mass percent of <b>Ca</b> in {CaCO3}?","a":"40.04","val":40.04396043560795,"unit":"%","dist":["20.00%","59.96%","60.07%"],"why":"Molar mass: 40.08 + 12.01 + 3(16.00) = 100.09 g/mol. Mass of Ca in 1 mol = 40.08 = 40.08 g. % = 40.08 ÷ 100.09 × 100 = 40.04%.","src":"Your notes","pctmode":1,"sec":"percent","id":"percent-07"},{"t":"num","q":"Mass percent of <b>H</b> in {H2O}?","a":"11.19","val":11.19005328596803,"unit":"%","dist":["5.60%","66.67%","88.81%"],"why":"Molar mass: 2(1.008) + 16.00 = 18.02 g/mol. Mass of H in 1 mol = 2×1.01 = 2.02 g. % = 2.02 ÷ 18.02 × 100 = 11.19%.","src":"Your notes","pctmode":1,"sec":"percent","id":"percent-08"},{"t":"num","q":"Mass percent of <b>Fe</b> in {Fe2O3}?","a":"69.94","val":69.94364433312461,"unit":"%","dist":["34.97%","40.00%","30.06%"],"why":"Molar mass: 2(55.85) + 3(16.00) = 159.70 g/mol. Mass of Fe in 1 mol = 2×55.85 = 111.70 g. % = 111.70 ÷ 159.70 × 100 = 69.94%.","src":"Your notes","pctmode":1,"sec":"percent","id":"percent-09"},{"t":"num","q":"Mass percent of <b>C</b> in {CO2}?","a":"27.29","val":27.289252442626676,"unit":"%","dist":["33.33%","72.71%","40.93%"],"why":"Molar mass: 12.01 + 2(16.00) = 44.01 g/mol. Mass of C in 1 mol = 12.01 = 12.01 g. % = 12.01 ÷ 44.01 × 100 = 27.29%.","src":"Your notes","pctmode":1,"sec":"percent","id":"percent-10"},{"t":"num","q":"Mass percent of <b>Na</b> in {NaCl}?","a":"39.34","val":39.33949349760438,"unit":"%","dist":["50.00%","60.66%","59.01%"],"why":"Molar mass: 22.99 + 35.45 = 58.44 g/mol. Mass of Na in 1 mol = 22.99 = 22.99 g. % = 22.99 ÷ 58.44 × 100 = 39.34%.","src":"Your notes","pctmode":1,"sec":"percent","id":"percent-11"},{"t":"num","q":"Mass percent of <b>S</b> in {Al2(SO4)3}?","a":"28.12","val":28.117602361399307,"unit":"%","dist":["9.37%","17.65%","71.88%"],"why":"Molar mass: 2(26.98) + 3(32.07) + 12(16.00) = 342.17 g/mol. Mass of S in 1 mol = 3×32.07 = 96.21 g. % = 96.21 ÷ 342.17 × 100 = 28.12%.","src":"Your notes","pctmode":1,"sec":"percent","id":"percent-12"},{"t":"mc","q":"Percent composition by mass of an element =","a":"(mass of the element in 1 mol ÷ molar mass of the compound) × 100","sets":[["(number of atoms of the element ÷ total atoms) × 100","(atomic mass ÷ 100) × molar mass","(molar mass ÷ mass of the element) × 100"],["(moles of element ÷ moles of compound) × 100","(atomic number ÷ mass number) × 100","(mass of compound ÷ mass of element)"]],"why":"Use MASS, not atom count. Multiply the atomic mass by the subscript first. All the percents should add to ~100%.","sec":"percent","id":"percent-13","src":"Your notes"},{"t":"mc","q":"A 20.0 g sample of a compound contains 8.00 g of calcium. What is the % calcium?","a":"40.0%","sets":[["25.0%","60.0%","2.50%"],["8.00%","12.0%","250%"]],"why":"% = part ÷ whole × 100 = 8.00 ÷ 20.0 × 100 = 40.0%.","sec":"percent","id":"percent-14","src":"Your notes"},{"t":"mc","q":"A compound is <b>36.9% N</b> and <b>63.1% O</b> by mass. Empirical formula?","a":"N2O3","af":1,"sets":[["NO2","N2O","NO"],["N2O5","NO3","N3O2"]],"why":"Assume 100 g → 36.9 g N, 63.1 g O. N: 36.9 ÷ 14.01 = 2.634 mol; O: 63.1 ÷ 16.00 = 3.944 mol. ÷ 2.634 → N 1 : O 1.50. 1.5 → ×2 → N₂O₃.","src":"HW #17 Q6a","sec":"empirical","id":"empirical-01"},{"t":"mc","q":"The compound (empirical formula N₂O₃) has a molar mass of <b>152.0 g/mol</b>. Molecular formula?","a":"N4O6","af":1,"sets":[["N2O3","N6O9","N3O4"],["N2O6","N4O3","N8O12"]],"why":"Empirical mass N₂O₃ = 76.02 g/mol. n = 152.0 ÷ 76.02 = 2.00 → 2 → N₄O₆.","src":"HW #17 Q6b","sec":"empirical","id":"empirical-02"},{"t":"mc","q":"A <b>2.548 g</b> sample has <b>1.581 g C</b>, <b>0.265 g H</b>, and the rest oxygen. Empirical formula?","a":"C3H6O","af":1,"sets":[["C2H4O","CH2O","C3H5O"],["C6H12O","C3H6O2","CH3O"]],"why":"O = 2.548 − 1.581 − 0.265 = 0.702 g. C: 1.581 ÷ 12.01 = 0.1316; H: 0.265 ÷ 1.008 = 0.2629; O: 0.702 ÷ 16.00 = 0.0439. ÷ 0.0439 → C 3.00 : H 5.99 : O 1 → C₃H₆O.","src":"HW #17 Q7a","sec":"empirical","id":"empirical-03"},{"t":"mc","q":"Empirical formula C₃H₆O, molar mass <b>174.2 g/mol</b>. Molecular formula?","a":"C9H18O3","af":1,"sets":[["C6H12O2","C3H6O","C12H24O4"],["C9H18O","C3H18O3","C6H12O3"]],"why":"Empirical mass C₃H₆O = 58.08 g/mol. n = 174.2 ÷ 58.08 = 3.00 → 3 → C₉H₁₈O₃.","src":"HW #17 Q7b","sec":"empirical","id":"empirical-04"},{"t":"mc","q":"A compound is <b>85.6% C</b> and <b>14.4% H</b>. Empirical formula?","a":"CH2","af":1,"sets":[["CH","CH3","C2H"],["CH4","C2H3","C3H8"]],"why":"C: 85.6 ÷ 12.01 = 7.127; H: 14.4 ÷ 1.008 = 14.286. ÷ 7.127 → 1 : 2.00 → CH₂.","src":"Self-quiz","sec":"empirical","id":"empirical-05"},{"t":"mc","q":"Empirical formula CH₂, molar mass <b>56.1 g/mol</b>. Molecular formula?","a":"C4H8","af":1,"sets":[["C2H4","C3H6","C5H10"],["C4H10","CH2","C8H16"]],"why":"Empirical mass CH₂ = 14.03. n = 56.1 ÷ 14.03 = 4.00 → 4 → C₄H₈.","src":"Self-quiz","sec":"empirical","id":"empirical-06"},{"t":"mc","q":"A <b>2.500 g</b> iron oxide contains <b>1.809 g Fe</b>; the rest is O. Empirical formula?","a":"Fe3O4","af":1,"sets":[["FeO","Fe2O3","Fe3O2"],["FeO2","Fe4O3","Fe2O"]],"why":"O = 0.691 g. Fe: 1.809 ÷ 55.85 = 0.03239; O: 0.691 ÷ 16.00 = 0.04319. ÷ 0.03239 → 1 : 1.33. 1.33 → ×3 → Fe₃O₄.","src":"Self-quiz","sec":"empirical","id":"empirical-07"},{"t":"mc","q":"A compound is <b>40.0% C, 6.71% H, 53.3% O</b>. Empirical formula?","a":"CH2O","af":1,"sets":[["CHO","CH2O2","C2H4O"],["CH3O","C2HO","CHO2"]],"why":"C: 3.331; H: 6.657; O: 3.331 mol. ÷ 3.331 → 1 : 2.00 : 1.00 → CH₂O.","src":"Study guide example I","sec":"empirical","id":"empirical-08"},{"t":"mc","q":"Empirical formula CH₂O, molar mass <b>90.08 g/mol</b>. Molecular formula?","a":"C3H6O3","af":1,"sets":[["C2H4O2","C6H12O6","CH2O"],["C3H6O","C4H8O4","C3H3O3"]],"why":"Empirical mass = 30.03. n = 90.08 ÷ 30.03 = 3.00 → 3 → C₃H₆O₃.","src":"Study guide example I","sec":"empirical","id":"empirical-09"},{"t":"mc","q":"A <b>3.000 g</b> sample has <b>1.309 g P</b>; the rest is O. Empirical formula?","a":"P2O5","af":1,"sets":[["PO2","PO3","P2O3"],["P5O2","PO5","P4O10"]],"why":"O = 1.691 g. P: 1.309 ÷ 30.97 = 0.04227; O: 1.691 ÷ 16.00 = 0.1057. Ratio 1 : 2.50 → ×2 → P₂O₅.","src":"Study guide example J","sec":"empirical","id":"empirical-10"},{"t":"mc","q":"Empirical formula P₂O₅, molar mass <b>283.9 g/mol</b>. Molecular formula?","a":"P4O10","af":1,"sets":[["P2O5","P6O15","P3O8"],["P4O5","P2O10","P8O20"]],"why":"Empirical mass = 141.94. n = 283.9 ÷ 141.94 = 2.00 → 2 → P₄O₁₀.","src":"Study guide example J","sec":"empirical","id":"empirical-11"},{"t":"mc","q":"A compound is <b>75.0% C</b> and <b>25.0% H</b>. Empirical formula?","a":"CH4","af":1,"sets":[["CH3","C3H","CH2"],["C2H6","CH","C4H"]],"why":"C: 75.0 ÷ 12.01 = 6.245; H: 25.0 ÷ 1.008 = 24.80. ÷ 6.245 → 1 : 3.97 → CH₄.","src":"Your notes","sec":"empirical","id":"empirical-12"},{"t":"mc","q":"Hydrate lab: <b>2.50 g</b> of CuSO₄·xH₂O is heated; <b>1.60 g</b> of anhydrous CuSO₄ remains. What is x?","a":"5","af":0,"sets":[["4","3","9"],["2","6","10"]],"why":"Water lost = 2.50 − 1.60 = 0.90 g → 0.90 ÷ 18.02 = 0.0500 mol. CuSO₄: 1.60 ÷ 159.62 = 0.0100 mol. Ratio = 4.98 → 5 → CuSO₄·5H₂O.","src":"Experiment #6 (hydrate)","sec":"empirical","id":"empirical-13"},{"t":"mc","q":"Empirical formula of glucose, {C6H12O6}?","a":"CH2O","af":1,"sets":[["C6H12O6","C2H4O2","CHO"],["C3H6O3","CH2O2","CH4O"]],"why":"Divide every subscript by the greatest common factor (6) → CH₂O.","src":"Your notes","sec":"empirical","id":"empirical-14"},{"t":"mc","q":"Empirical formula of hydrogen peroxide, {H2O2}?","a":"HO","af":1,"sets":[["H2O","H2O2","HO2"],["H2O","OH2","H4O4"]],"why":"2 : 2 reduces to 1 : 1 → HO. (The molecular formula stays H₂O₂.)","src":"Your notes","sec":"empirical","id":"empirical-15"},{"t":"mc","q":"Empirical formula of {C2H6}?","a":"CH3","af":1,"sets":[["C2H6","CH2","CH4"],["C2H3","CH6","C3H"]],"why":"2 : 6 → 1 : 3 → CH₃.","src":"Your notes","sec":"empirical","id":"empirical-16"},{"t":"mc","q":"Empirical formula of {N2O4}?","a":"NO2","af":1,"sets":[["N2O4","N2O","NO4"],["NO","N4O2","N2O2"]],"why":"2 : 4 → 1 : 2 → NO₂. (Molecular formula N₂O₄; but never reduce it when NAMING.)","src":"Your notes","sec":"empirical","id":"empirical-17"},{"t":"mc","q":"Which pair has the SAME empirical formula?","a":"C₂H₂ and C₆H₆","af":0,"sets":[["CO and CO₂","H₂O and H₂O₂","CH₄ and C₂H₆"],["NO and NO₂","C₂H₄ and C₂H₆","SO₂ and SO₃"]],"why":"C₂H₂ → CH; C₆H₆ → CH. Same empirical (CH), different molecular formulas.","src":"Your notes","sec":"empirical","id":"empirical-18"},{"t":"mc","q":"After dividing by the smallest moles you get <b>1 : 1.33</b>. Multiply everything by…","a":"3","af":0,"sets":[["2","4","1 (just round)"],["5","2","6"]],"why":"x.33 or x.67 → ×3 (1.33 × 3 = 4). x.5 → ×2; x.25/x.75 → ×4.","src":"Your notes","sec":"empirical","id":"empirical-19"},{"t":"mc","q":"After dividing by the smallest moles you get <b>1 : 2.50</b>. You should…","a":"multiply both by 2 → 2 : 5","af":0,"sets":[["round to 1 : 3","round to 1 : 2","multiply both by 3 → 3 : 7.5"],["multiply both by 4 → 4 : 10","divide by 2.5","round to 1 : 2.5"]],"why":"Never round x.5. Multiply all by 2 → 2 : 5.","src":"Your notes","sec":"empirical","id":"empirical-20"},{"t":"mc","q":"After dividing by the smallest moles you get <b>1 : 1.25</b>. Multiply everything by…","a":"4","af":0,"sets":[["2","3","5"],["1 (just round)","8","6"]],"why":"x.25 → ×4 (1.25 × 4 = 5) → 4 : 5.","src":"Your notes","sec":"empirical","id":"empirical-21"},{"t":"mc","q":"An empirical formula is…","a":"the simplest whole-number ratio of atoms in a compound","af":0,"sets":[["the actual number of atoms in one molecule","the mass percent of each element","the formula with the largest subscripts"],["always the same as the molecular formula","the ratio of masses of the elements","the number of moles in 100 g"]],"why":"Empirical = simplest ratio (CH₂O). Molecular = actual formula, a whole-number multiple (C₆H₁₂O₆).","src":"Your notes","sec":"empirical","id":"empirical-22"},{"t":"mc","q":"To find a molecular formula from the empirical formula you need…","a":"the molar mass of the compound","af":0,"sets":[["the density","the melting point","the number of moles"],["the volume of the sample","Avogadro’s number only","the charge on each ion"]],"why":"n = molar mass ÷ empirical formula mass. Multiply every subscript by n.","src":"Your notes","sec":"empirical","id":"empirical-23"},{"t":"mc","q":"First step when given percent composition for an empirical-formula problem?","a":"Assume a 100 g sample so each % becomes grams","af":0,"sets":[["Multiply each % by Avogadro’s number","Divide each % by 100 and stop","Multiply each % by the molar mass"],["Add all the percents together","Divide each % by its atomic number","Assume a 1 g sample"]],"why":"100 g sample → 40.0% becomes 40.0 g. Then grams → moles → divide by smallest.","src":"Your notes","sec":"empirical","id":"empirical-24"}];

function rich(s){

 out=out.replace(/10\^(-?\d+)/g,(m,e)=>'10<sup>'+e.replace('-','−')+'</sup>');
 out=out.replace(/(^|[\s(→·,:;=+])((?:[A-Z][a-z]?\d*|\((?:[A-Z][a-z]?\d*)+\)\d*){1,8})(?=$|[\s.,;:)→·])/g,(m,pre,f)=>{
   if(!/\d/.test(f)||/^[A-Z][a-z]?$/.test(f))return m; if(!/[A-Z]/.test(f))return m; return pre+fmtF(f)});
 out=out.replace(/\u0001(\d+)\u0002/g,(m,i)=>toks[+i]);
 return out}

/* grading */
const subToD=s=>s.replace(/[₀-₉]/g,c=>String(c.charCodeAt(0)-8320));
const normF=s=>subToD(String(s)).replace(/\s+/g,'').replace(/[\[{]/g,'(').replace(/[\]}]/g,')');
function normN(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/aluminium/g,'aluminum').replace(/sulph/g,'sulf')
 .replace(/[^a-z0-9()]+/g,' ').replace(/\s*\(\s*/g,'(').replace(/\s*\)\s*/g,') ').replace(/\s+/g,' ').trim()
 .replace(/monooxide/g,'monoxide').replace(/tetraoxide/g,'tetroxide').replace(/pentaoxide/g,'pentoxide').replace(/hexaoxide/g,'hexoxide').replace(/heptaoxide/g,'heptoxide').replace(/decaoxide/g,'decoxide')}
const ROMV={'1':'i','2':'ii','3':'iii','4':'iv','5':'v','6':'vi','7':'vii'};
function gradeTyped(q,input){
 const raw=String(input||'').trim();if(!raw)return{res:'bad'};
 if(q.mode==='formula'){const x=normF(raw),a=normF(q.a);if(x===a)return{res:'ok'};
  if(x.toLowerCase()===a.toLowerCase())return{res:'close',note:'Counted, but watch capitals: '+q.a+' (Co is cobalt, CO is carbon monoxide).'};return{res:'bad'}}
 const x=normN(raw),T=[q.a,...(q.alt||[])].map(normN);
 if(T.includes(x))return{res:'ok'};
 const xa=x.replace(/\((\d)\)/g,(m,d)=>'('+(ROMV[d]||d)+')');
 if(xa!==x&&T.includes(xa))return{res:'close',note:'Counted, but write the charge as a Roman numeral: '+q.a+'.'};
 const xb=x.replace(/ (i|ii|iii|iv|v|vi|vii|\d) /,(m,r)=>'('+(ROMV[r]||r)+') ');
 if(xb!==x&&T.includes(xb))return{res:'close',note:'Counted. Put the Roman numeral in parentheses right after the metal: '+q.a+'.'};
 return{res:'bad'}}

const INT=[0,1,2,4,7,12];
function mupd(id,ok){const m={b:0,s:0,c:0,due:0,...PR.m[id]};m.s++;if(ok)m.c++;if(!ok)m.b=Math.max(0,m.b-2);else if(m.due<=PR.clock)m.b=Math.min(5,m.b+1);m.due=PR.clock+INT[m.b];PR.m[id]=m}
const weight=id=>{const m=PR.m[id]||{b:0,s:0,due:0};let w=(6-m.b)**2;if(m.due<=PR.clock)w*=2;if(!m.s)w*=1.5;return w};
function secMastery(sec){const qs=Q.filter(q=>q.sec===sec);return qs.reduce((a,q)=>a+((PR.m[q.id]||{}).b||0),0)/(qs.length*5)}
function pickWeighted(pool,n){const out=[],p=pool.slice();while(out.length<n&&p.length){const tot=p.reduce((a,q)=>a+weight(q.id),0);let r=Math.random()*tot,i=0;for(;i<p.length-1;i++){r-=weight(p[i].id);if(r<=0)break}out.push(p.splice(i,1)[0])}return out}
function pickMixed(secs,n){
 const W={n2f:3,f2n:3,ions:1.5,compounds:1.2,ptable:1,moles:2,percent:1,empirical:1.6};
 const tot=secs.reduce((a,s)=>a+W[s],0);const alloc=secs.map(s=>({s,k:Math.max(1,Math.round(n*W[s]/tot))}));
 let sum=alloc.reduce((a,x)=>a+x.k,0);let guard=0;
 while(sum>n&&guard++<200){const x=alloc.filter(x=>x.k>1).sort((a,b)=>b.k-a.k)[0];if(!x)break;x.k--;sum--}
 while(sum<n&&guard++<400){const x=alloc.slice().sort((a,b)=>a.k/W[a.s]-b.k/W[b.s])[0];x.k++;sum++}
 let out=[];alloc.forEach(x=>{const pool=Q.filter(q=>q.sec===x.s);out=out.concat(pickWeighted(pool,Math.min(x.k,pool.length)))});return shuffle(out).slice(0,n)}

function hintFor(q){
 if(q.mode==='formula')return 'Hint: find each ion’s charge, criss-cross, reduce, check the total is 0. It starts with '+q.a.slice(0,2)+'…';
 if(q.mode==='name')return 'Hint: metal or NH₄⁺ first → ionic (no prefixes). Nonmetals only → prefixes. Starts with “'+q.a.split(' ')[0].slice(0,4)+'…”';

 if(G.kind==='test'){const left=Math.max(0,(G.testEnd-Date.now())/1000);const tv=$('#ttv');if(tv)tv.innerHTML=Math.floor(left/60)+':'+String(Math.floor(left%60)).padStart(2,'0')+'<small>LEFT</small>';const ring=$('#tring');if(ring){const C=2*Math.PI*27;ring.style.strokeDashoffset=C*(1-left/1800)}if(left<=0)endGame();return}

function hudHTML(){
 const q=G.q,me=G.me,rv=G.rv,duel=G.kind==='duel';const C=2*Math.PI*27;const total=Math.max(1000,me.s,rv.s)*1.08;
 const timer=G.kind==='prac'?`<div class="timer" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="none" stroke="var(--surface2)" stroke-width="6"/></svg><div class="tv">∞<small>UNTIMED</small></div></div>`:
 `<div class="timer" role="timer" aria-label="time left"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="none" stroke="var(--surface2)" stroke-width="6"/><circle id="tring" cx="32" cy="32" r="27" fill="none" stroke="var(--ok)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="tv" id="ttv">${G.kind==='test'?'30:00':G.limit}<small>${G.kind==='test'?'LEFT':'SEC'}</small></div></div>`;
 const p1=duel?`<div class="pcard"><div class="av p1">A</div><div style="min-width:0"><div class="pname">${esc(G.rival.n)}</div><div class="pmeta">${DIFFN[PR.diff]} bot${rv.frozen?' · frozen':''}</div></div><div class="pscore p1" id="rvs">${rv.s}</div><div class="lock ${G.rvLocked?'on':''}" id="rlock">LOCKED IN</div></div>`
 :`<div class="pcard"><div style="min-width:0"><div class="pname">${G.kind==='test'?'Test Sim':'Practice'}</div><div class="pmeta">${G.kind==='test'?'graded at the end':me.cor+' right so far'}</div></div><div class="pscore p1">${G.i+1}<span style="font-size:14px;color:var(--muted)">/${G.qs.length}</span></div></div>`;
 return `<div class="hud"><div class="pcard me"><div class="av p0">${esc(PR.name[0]||'N')}</div><div style="min-width:0"><div class="pname">${esc(PR.name)}</div><div class="pmeta"><span class="combo ${[5,10,20].includes(me.streak)?'pulse':''}">${ICON.flame}${me.streak} streak</span></div></div><div class="pscore p0" id="mys">${G.kind==='test'?'':me.s}</div></div>${p1}${timer}</div>
 ${duel?`<div class="race"><span>${esc(PR.name.toUpperCase())}</span><div class="track t0"><i style="width:${Math.min(100,100*me.s/total)}%"></i></div><span>AVOGADRO</span><div class="track t1"><i style="width:${Math.min(100,100*rv.s/total)}%"></i></div></div>`:'<div style="height:10px"></div>'}
 <div class="chips"><span class="pill">Q ${G.i+1}/${G.qs.length}</span><span class="pill">${q.t==='type'?(q.mode==='formula'?'Type the formula':'Type the name'):q.t==='num'?'Calculate':'Pick one'}</span><span class="pill">${esc(SECN[q.sec])}</span><button class="pill" data-act="quit" aria-label="Quit to home">${ICON.home.replace('class="ico"','width="14" height="14"')} Quit</button></div>`}
function updHud(){if(!G)return;const a=$('#mys'),b=$('#rvs');if(a&&G.kind!=='test')a.textContent=G.me.s;if(b)b.textContent=G.rv.s;
 if(G.kind==='duel'){const total=Math.max(1000,G.me.s,G.rv.s)*1.08;const t=document.querySelectorAll('.track i');if(t[0])t[0].style.width=Math.min(100,100*G.me.s/total)+'%';if(t[1])t[1].style.width=Math.min(100,100*G.rv.s/total)+'%'}}
function renderQ(){
 const q=G.q;let body='';
 if(G.phase==='q'){
  const hint=G.hint?`<div class="hint">${rich(G.hint)}</div>`:'';
  if(q.t==='type'){const f=q.mode==='formula';
   body=`<div class="typer"><div class="inrow"><input id="tin" class="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="${f?'Type the formula':'Type the name'}" placeholder="${f?'e.g. Al2(SO4)3':'e.g. iron(III) sulfate'}" value="${esc(G.input)}"><button class="btn green" data-act="sub">Submit</button></div>
   ${f?`<div class="prev" id="prev" aria-live="polite">Preview: <em>${G.input?fmtF(normF(G.input)):'—'}</em></div><div class="keys">${['(',')','2','3','4','5'].map(k=>`<button data-act="key" data-v="${k}" aria-label="insert ${k}">${k}</button>`).join('')}</div>`
   :`<div class="keys">${['(I)','(II)','(III)','(IV)','mono','di','tri','tetra','penta','ide','ate','ite'].map(k=>`<button data-act="key" data-v="${k}">${k}</button>`).join('')}</div>`}${hint}
   <p style="text-align:center;color:var(--dim);font-size:12px;font-weight:600;margin:0">${f?'Type numbers normally; they become subscripts. Capitals matter (Co ≠ CO).':'Spelling counts. Roman numerals in parentheses: copper(II) sulfate.'}</p></div>`}
  else body=`${hint}<div class="opts">${G.opts.map((o,i)=>`<button class="opt ${G.gone.includes(o)?'gone':''}" data-act="pick" data-i="${i}" aria-label="Option ${i+1}"><span class="sh" aria-hidden="true">${SH[i]}</span><span>${optHTML(q,o)}</span><span class="k" aria-hidden="true">${i+1}</span></button>`).join('')}</div>`}
 else{
  const ok=G.res!=='bad';const last=G.log[G.log.length-1];
  const opts=G.opts?`<div class="opts" aria-hidden="true">${G.opts.map((o,i)=>{const r=isRight(q,o);return `<div class="opt ${r?'right':G.picked===o?'wrong':'dim'}"><span class="sh">${r?ICON.check.replace('currentColor','#fff'):(G.picked===o?ICON.x.replace('currentColor','#fff'):SH[i])}</span><span>${optHTML(q,o)}</span></div>`}).join('')}</div>`:'';
  const typed=q.t==='type'&&G.picked!=null?`<div class="note">You typed: ${q.mode==='formula'?fmtF(normF(G.picked)):esc(G.picked)}</div>`:'';
  body=`<div class="reveal ${ok?'ok':'bad'}" role="status"><div class="badge" style="color:${ok?'#0d7d45':'#a91f36'}">${ok?ICON.check:ICON.x}</div>
  <h3>${ok?(G.res==='close'?'Counted!':rnd(['Correct!','Nailed it!','Exactly!'])):(last.given==='(time ran out)'?'Time’s up!':'Not quite')}</h3>
  ${G.kind==='duel'?`<div class="pts">${ok?'+'+G.lastPts+(G.cat?' · Catalyst ×2':''):'+0'+(G.buf?' · Buffer saved your streak':'')}</div>`:''}
  ${G.xpGain?`<div style="font-weight:800;font-size:13px;opacity:.95">+${G.xpGain} XP${G.crit?' · CRIT ×2':''}</div>`:''}
  ${G.note?`<div class="note">${esc(G.note)}</div>`:''}${typed}
  <div class="ans"><small>Answer</small>${q.af||q.mode==='formula'?fmtF(q.a):rich(ansFull(q))}</div>
  <div class="why"><b class="lbl">Worked solution</b>${rich(q.why)}<div style="margin-top:6px;font-size:12px;opacity:.9;font-weight:700">Source: ${esc(q.src)}${q.beyond?' · Beyond the guide':''}</div></div>
  ${G.kind==='duel'?`<div class="vs"><span><i style="background:var(--p0)"></i>${esc(PR.name)} +${G.lastPts}</span><span><i style="background:var(--p1)"></i>${esc(G.rival.n)} ${G.rvNote==='frozen'?'frozen (0)':G.rvNote==='missed'?'missed (0)':'+'+G.rvPts+(G.rvNote==='halved'?' (halved)':'')}</span></div>`:''}</div>
  <div class="nextbar"><button class="btn cyan" data-act="next" id="nextb">${G.i+1>=G.qs.length?'See results':'Next question'} →</button></div>${opts}`}
 app.innerHTML=hudHTML()+`<div class="qcard">${q.src&&q.src!=='Your notes'?`<span class="src">${esc(q.src)}</span>`:''}${q.beyond?'<span class="bey">Beyond the guide</span>':''}<div>${rich(q.q)}</div></div>`+body;
 if(G.phase==='r'){const nb=$('#nextb');if(nb)nb.focus({preventScroll:true});const r=document.querySelector('.reveal');if(r&&matchMedia('(max-width:720px)').matches)r.scrollIntoView({block:'start'})}else window.scrollTo({top:0});
 renderHand()}
function renderHand(){
 if(!G||G.kind!=='duel'||G.phase==='end'){handEl.hidden=true;return}
 handEl.hidden=false;const K=['Q','W','E','R'];const armed=Object.keys(G.arm).map(k=>ABY[k].n);
 handEl.innerHTML=`<div class="in"><div class="charge"><b>${ICON.bolt} CHARGE ${Math.round(G.charge)}%</b><div class="cbar"><i style="width:${G.charge}%"></i></div><div class="armed">${armed.length?'Armed: '+esc(armed.join(', ')):'Every 3 right answers = a new card'}</div></div>
 <div class="cards">${[0,1,2,3].map(i=>{const id=G.hand[i];if(!id)return `<div class="empty">empty</div>`;const a=ABY[id];return `<button class="ab ${a.k}" data-act="card" data-i="${i}" aria-label="${esc(a.n)}: ${esc(a.d)}. Key ${K[i]}" title="${esc(a.d)} (key ${K[i]})"><span class="tag">${a.k==='atk'?'ATK':a.k==='def'?'DEF':a.k==='now'?'NOW':'BOOST'}</span><span class="ai"><svg viewBox="0 0 24 24">${AIC[a.ic]}</svg></span><span><b>${esc(a.n)}</b><small>${esc(a.d)}</small></span></button>`}).join('')}</div></div>`;
 if(G.newCard){G.newCard=false;toast('New ability card!','gold')}}
function givenHTML(l){const g=String(l.given);if(g[0]==='(')return esc(g);if(l.q.mode==='formula')return fmtF(normF(g));if(l.q.af)return fmtF(g);return rich(g)}
function renderEnd(){
 handEl.hidden=true;const right=G.log.filter(l=>l.ok).length,n=G.log.length;const pct=n?Math.round(100*right/n):0;
 const bySec={};G.log.forEach(l=>{const s=bySec[l.q.sec]||(bySec[l.q.sec]={r:0,n:0});s.n++;if(l.ok)s.r++});
 const missed=G.log.filter(l=>!l.ok);let head;
 if(G.kind==='duel'){const win=G.me.s>G.rv.s,tie=G.me.s===G.rv.s;head=`<div class="kick">${win?'Victory':tie?'Draw':'Defeat'}</div><h2 class="${win?'hw':tie?'':'hl'}">${win?'You beat Avogadro!':tie?'Dead heat!':'Avogadro wins this one'}</h2><p class="sub" style="font-size:20px;font-weight:800">${G.me.s} – ${G.rv.s}</p>`}
 else if(G.kind==='test'){const gr=pct>=93?'A':pct>=90?'A−':pct>=87?'B+':pct>=83?'B':pct>=80?'B−':pct>=77?'C+':pct>=70?'C':'keep drilling';head=`<div class="kick">Test Sim result</div><h2>${pct}% <span style="font-size:.5em;color:var(--muted)">${gr}</span></h2><p class="sub">${right} of ${n} correct${n<G.qs.length?' · time ran out after '+n+' questions':''}</p>`}
 else head=`<div class="kick">Practice round done</div><h2>${right}/${n}</h2><p class="sub">Mastery rings on the home screen just updated.</p>`;
 const list=(G.kind==='test'?G.log:missed);
 app.innerHTML=`<section class="podium">${head}</section>
 <div class="stats"><div class="stat"><b>${pct}%</b><small>Accuracy</small></div><div class="stat"><b>${G.me.maxStreak}</b><small>Best streak</small></div><div class="stat"><b>${missed.length}</b><small>Missed</small></div><div class="stat"><b>${lvlInfo(PR.xp).l}</b><small>Level</small></div></div>
 <div class="sect"><h2>By topic</h2><div class="tiles">${Object.entries(bySec).map(([s,v])=>`<div class="tile" style="min-height:0">${ringSVG(v.r/v.n,v.r/v.n>=.8?'var(--ok)':v.r/v.n>=.6?'var(--gold)':'var(--bad)')}<b>${esc(SECN[s])}</b><small>${v.r}/${v.n} right</small></div>`).join('')}</div></div>
 <div class="row" style="justify-content:center;margin:22px 0">${missed.length?`<button class="btn red" data-act="drillmiss">Drill the ${missed.length} I missed</button>`:''}<button class="btn cyan" data-act="again">${G.kind==='duel'?'Rematch':'Go again'}</button><button class="btn ghost" data-act="home">${ICON.home} Home</button></div>
 <div class="sect"><h2>${G.kind==='test'?'Review every question':'Review what you missed'}</h2><div class="miss">${list.map(l=>`<div class="mi ${l.ok?'okk':''}"><div class="q">${rich(l.q.q)}</div><div class="a">${l.ok?'':`<span class="y">You: ${givenHTML(l)}</span> · `}<span class="c">Answer: ${l.q.af||l.q.mode==='formula'?fmtF(l.q.a):rich(ansFull(l.q))}</span></div><div class="w">${rich(l.q.why)}</div></div>`).join('')||'<p class="sub" style="text-align:center">Nothing missed. Clean run!</p>'}</div></div>`;
 window.scrollTo({top:0})}
function render(){if(!G)return renderHome();if(G.phase==='end')return renderEnd();renderQ()}
function modal(title,text,okLabel,onOk){const prev=document.activeElement;const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">${esc(title)}</h3><p>${esc(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-m="no">Cancel</button><button class="btn red" data-m="ok">${esc(okLabel)}</button></div></div>`;document.body.appendChild(m);
 const close=()=>{m.remove();document.removeEventListener('keydown',kd);if(prev&&prev.focus)prev.focus()};const kd=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',kd);
 m.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(e.target===m||(b&&b.dataset.m==='no'))close();else if(b&&b.dataset.m==='ok'){close();onOk()}});m.querySelector('[data-m=ok]').focus()}
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,v=b.dataset.v;
 switch(act){
  case 'duel':startGame('duel');break;case 'prac':startGame('prac');break;case 'test':startGame('test');break;
  case 'len':PR.len=+v;save();renderHome();break;case 'diff':PR.diff=+v;save();renderHome();break;
  case 'sec':{const s=PR.secs;if(s.includes(v)){if(s.length>1)PR.secs=s.filter(x=>x!==v);else toast('Keep at least one topic on')}else PR.secs=s.concat(v);save();renderHome();break}
  case 'allsec':PR.secs=PR.secs.length===SECS.length?['n2f','f2n','ions']:SECS.map(s=>s.id);save();renderHome();break;
  case 'theme':PR.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();applyTheme();break;
  case 'snd':PR.snd=!PR.snd;save();renderHome();if(PR.snd)sfx.ok();break;
  case 'reset':modal('Reset all progress?','XP, badges, mastery and stats on this device will be erased.','Reset',()=>{try{localStorage.removeItem(PKEY)}catch(e){}PR=defProf();save();applyTheme();renderHome()});break;
  case 'pick':if(G&&G.phase==='q'){const o=G.opts[+b.dataset.i];if(!G.gone.includes(o))submit(o)}break;
  case 'sub':{const inp=$('#tin');if(inp&&inp.value.trim())submit(inp.value);else if(inp){inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),400);inp.focus()}break}
  case 'key':{const inp=$('#tin');if(!inp)break;const s=inp.selectionStart??inp.value.length,en=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+v+inp.value.slice(en);inp.focus();inp.setSelectionRange(s+v.length,s+v.length);inp.dispatchEvent(new Event('input',{bubbles:true}));break}
  case 'next':nextQ();break;
  case 'quit':modal('Quit this round?','Answers so far still count toward mastery and XP.','Quit',()=>{clearInterval(TMR);G=null;renderHome()});break;
  case 'again':{const k=G.kind;if(k==='prac')startGame('prac',G.secs?{secs:G.secs}:{});else startGame(k);break}
  case 'drillmiss':startGame('drill',{qs:shuffle(G.log.filter(l=>!l.ok).map(l=>l.q))});break;
  case 'home':G=null;renderHome();break}});
handEl.addEventListener('click',e=>{const b=e.target.closest('[data-act=card]');if(b)playCard(+b.dataset.i)});
app.addEventListener('input',e=>{if(e.target.id==='tin'&&G){G.input=e.target.value;const p=$('#prev');if(p)p.innerHTML='Preview: <em>'+(G.input?fmtF(normF(G.input)):'—')+'</em>'}});
document.addEventListener('keydown',e=>{
 if(document.querySelector('.modal')||!G||G.phase==='end')return;
 const inInput=e.target.id==='tin';
 if(e.key==='Enter'){if(G.phase==='q'&&inInput){e.preventDefault();if(e.target.value.trim())submit(e.target.value)}else if(G.phase==='r'){e.preventDefault();nextQ()}return}
 if(inInput||e.metaKey||e.ctrlKey||e.altKey)return;
 if(G.phase==='q'&&G.opts&&/^[1-4]$/.test(e.key)){const o=G.opts[+e.key-1];if(o!=null&&!G.gone.includes(o))submit(o)}
 const ki=['q','w','e','r'].indexOf(e.key.toLowerCase());if(ki>=0&&G.kind==='duel')playCard(ki);
 if(e.key===' '&&G.phase==='r'){e.preventDefault();nextQ()}});
try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(!PR.theme)applyTheme()})}catch(e){}
applyTheme();renderHome();
window.__chem={Q,gradeTyped,normN,startGame,submit,nextQ,ansDisp,isRight,playCard,rich,get G(){return G},get PR(){return PR}};
